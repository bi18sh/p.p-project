/* ═══════════════ نظام الألوان ═══════════════ */
:root{
  --bg:#0B1628; --bg2:#101F35; --card:#152943; --card2:#122339;
  --line:#29445E; --line2:#1e3450;
  --txt:#F5F7FA; --txt2:#A9B8CC;
  --primary:#19BDB4; --secondary:#65D1D8; --accent:#F4B942;
  --c1:#19BDB4; --c2:#65D1D8; --c3:#4C8DF6; --c4:#8B7CF6; --c5:#F4B942; --c6:#3FBF7F; --c7:#E4674F; --c8:#CBD5E1;
  --on-c:#052029;
  --glass:rgba(17,33,56,.88); --scrim:rgba(4,10,20,.82);
  --soft:rgba(25,189,180,.10); --chip:rgba(41,68,94,.42); --hover:rgba(25,189,180,.11);
  --grid-line:rgba(41,68,94,.42);
  --sh1:0 14px 34px -18px rgba(0,0,0,.85); --sh2:0 34px 70px -28px rgba(0,0,0,.92);
  --r:18px; --r-sm:12px; --r-lg:26px; --pill:999px;
  --ffh:Cairo,'Segoe UI',Tahoma,'Noto Sans Arabic',Arial,sans-serif;
  --ffb:Tajawal,Cairo,'Segoe UI',Tahoma,'Noto Sans Arabic',Arial,sans-serif;
  --ease:cubic-bezier(.22,.85,.3,1); --head:74px; --maxw:1290px;
  --grain:.05;
}
html[data-theme=light]{
  --bg:#EDF1F7; --bg2:#F7F9FC; --card:#FFFFFF; --card2:#F3F7FB;
  --line:#D2DCE8; --line2:#E2E9F2;
  --txt:#0B1628; --txt2:#4E6178;
  --primary:#0C857F; --secondary:#0E7490; --accent:#A9710A;
  --c1:#0C857F; --c2:#0E7490; --c3:#2C6FD6; --c4:#6A54E0; --c5:#B07508; --c6:#1F8F58; --c7:#C6462F; --c8:#64748B;
  --on-c:#FFFFFF;
  --glass:rgba(255,255,255,.92); --scrim:rgba(15,26,44,.55);
  --soft:rgba(12,133,127,.08); --chip:rgba(11,22,40,.055); --hover:rgba(12,133,127,.09);
  --grid-line:rgba(120,145,175,.22);
  --sh1:0 12px 28px -18px rgba(20,40,70,.35); --sh2:0 30px 60px -26px rgba(20,40,70,.35);
  --grain:.025;
}
*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:var(--ffb);font-size:clamp(1rem,.95rem + .2vw,1.07rem);line-height:1.95;color:var(--txt);
  background:var(--bg);overflow-x:clip;min-height:100vh;position:relative;
  background-image:
    radial-gradient(1200px 640px at 100% -10%,color-mix(in srgb,var(--c1) 20%,transparent),transparent 62%),
    radial-gradient(1000px 560px at -12% 4%,color-mix(in srgb,var(--c3) 17%,transparent),transparent 60%),
    radial-gradient(900px 520px at 55% 106%,color-mix(in srgb,var(--c5) 11%,transparent),transparent 62%);
  background-attachment:fixed;
  transition:background-color .45s var(--ease),color .45s var(--ease);
}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.6;
  background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:66px 66px;
  -webkit-mask-image:radial-gradient(1200px 800px at 72% -4%,#000,transparent 76%);
  mask-image:radial-gradient(1200px 800px at 72% -4%,#000,transparent 76%)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:var(--grain);
  background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
ul,ol{list-style:none}
a{color:var(--secondary);text-decoration:none;transition:color .2s}
a:hover{color:var(--accent)}
bdi{unicode-bidi:isolate;font-family:var(--ffh)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
::selection{background:color-mix(in srgb,var(--c1) 40%,transparent);color:var(--txt)}
*{scrollbar-width:thin;scrollbar-color:var(--primary) var(--bg2)}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:var(--bg2);border-radius:99px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--primary),color-mix(in srgb,var(--primary) 55%,var(--bg)));border:3px solid var(--bg2);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--secondary),var(--accent))}
::-webkit-scrollbar-corner{background:var(--bg2)}

/* ═══════════════ أدوات عامة ═══════════════ */
.wrap{width:min(100% - 2.4rem,var(--maxw));margin-inline:auto;position:relative;z-index:1}
.skip{position:fixed;inset-inline-start:1rem;top:-120px;z-index:400;background:var(--accent);color:var(--on-c);font:700 .95rem/1 var(--ffh);padding:.95rem 1.3rem;border-radius:0 0 14px 14px;transition:top .25s}
.skip:focus{top:0}
.sec{padding:clamp(3rem,6vw,5.4rem) 0;position:relative;z-index:1;scroll-margin-top:calc(var(--head) + 24px)}
.sec--alt{background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--bg2) 88%,transparent) 12%,color-mix(in srgb,var(--bg2) 88%,transparent) 88%,transparent);border-block:1px solid var(--line2)}
h1,h2,h3,h4{font-family:var(--ffh);line-height:1.35;font-weight:700}
h1{font-size:clamp(1.95rem,4.4vw,3.4rem);font-weight:900;line-height:1.2}
h2{font-size:clamp(1.45rem,2.6vw,2.15rem)}
h3{font-size:clamp(1.08rem,1.5vw,1.28rem)}
h4{font-size:1.02rem}
p{color:var(--txt2)}
strong{color:var(--txt);font-weight:700}
.eyebrow{display:inline-flex;align-items:center;gap:.5rem;font:700 .8rem/1 var(--ffh);letter-spacing:.05em;color:var(--primary);background:var(--soft);border:1px solid color-mix(in srgb,var(--primary) 34%,transparent);padding:.5rem .95rem;border-radius:var(--pill);margin-bottom:.95rem}
.head{max-width:76ch;margin-bottom:clamp(1.6rem,3vw,2.6rem)}
.head.center{margin-inline:auto;text-align:center}
.head .lead{margin-top:.85rem;font-size:1.04rem}
.grad{background:linear-gradient(100deg,var(--c1),var(--c2) 40%,var(--c5));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:220% 100%;animation:hue 11s ease-in-out infinite}
.mt-s{margin-top:.8rem}.mt-m{margin-top:1.5rem}.mt-l{margin-top:2.4rem}
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.rv.in{opacity:1;transform:none}

/* ═══════════════ الرأس ═══════════════ */
.progress{position:fixed;top:0;inset-inline:0;height:3px;z-index:130;background:linear-gradient(90deg,var(--c5),var(--c1),var(--c3));transform:scaleX(0);transform-origin:var(--po,right) center;pointer-events:none}
[dir=ltr] .progress{--po:left}
.hdr{position:sticky;top:0;z-index:110;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid var(--line)}
.hdr::before{content:"";position:absolute;inset-inline:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--c1),var(--c2),var(--c5),transparent)}
.hdr-in{display:flex;align-items:center;gap:.7rem;min-height:var(--head)}
.brand{display:flex;align-items:center;gap:.65rem;color:var(--txt);flex:none}
.brand:hover{color:var(--txt)}
.mark{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(145deg,color-mix(in srgb,var(--c1) 30%,transparent),color-mix(in srgb,var(--c3) 18%,transparent));border:1px solid color-mix(in srgb,var(--c1) 52%,transparent);box-shadow:0 0 22px -8px var(--c1);position:relative;font:900 .92rem/1 var(--ffh);color:var(--secondary)}
.mark::after{content:"";position:absolute;inset:-4px;border-radius:16px;border:1px dashed color-mix(in srgb,var(--c2) 32%,transparent);animation:spin 24s linear infinite}
.btxt{display:flex;flex-direction:column;line-height:1.25}
.btxt b{font:900 .95rem/1.2 var(--ffh);letter-spacing:.3px;font-family:var(--ffh)}
.btxt small{font-size:.71rem;color:var(--txt2)}
.nav{margin-inline-start:auto}
.nav>ul{display:flex;align-items:center;gap:.05rem}
.nav>ul>li{position:relative}
.nav>ul>li>a,.nav>ul>li>button{display:flex;align-items:center;gap:.3rem;padding:.6rem .68rem;border-radius:10px;font:700 .87rem/1 var(--ffh);color:var(--txt2);white-space:nowrap;transition:.22s}
.nav>ul>li>a:hover,.nav>ul>li>button:hover,.nav>ul>li:focus-within>a,.nav>ul>li:focus-within>button{color:var(--txt);background:var(--hover)}
.nav a.cur,.nav button.cur{color:var(--primary);background:var(--soft);box-shadow:inset 0 -2px 0 var(--primary)}
.caret{width:.36rem;height:.36rem;border-inline-end:2px solid currentColor;border-block-end:2px solid currentColor;transform:rotate(45deg);margin-top:-3px;opacity:.6}
.has::after{content:"";position:absolute;inset-inline:0;top:100%;height:.75rem}
.drop{position:absolute;inset-inline-start:0;top:calc(100% + .5rem);min-width:238px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:16px;padding:.4rem;box-shadow:var(--sh2);opacity:0;visibility:hidden;transform:translateY(-10px);transition:.22s var(--ease);z-index:60}
.has:hover>.drop,.has:focus-within>.drop,.has.open>.drop{opacity:1;visibility:visible;transform:none}
.drop a{display:flex;align-items:center;gap:.5rem;padding:.58rem .8rem;border-radius:10px;color:var(--txt2);font-size:.9rem;font-weight:500}
.drop a::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--primary);opacity:.45;transition:.2s}
.drop a:hover,.drop a.cur{background:var(--hover);color:var(--txt)}
.drop a:hover::before,.drop a.cur::before{opacity:1;transform:scale(1.4)}
.acts{display:flex;align-items:center;gap:.4rem;margin-inline-start:.3rem}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--chip);color:var(--txt2);transition:.24s var(--ease)}
.iconbtn:hover{border-color:var(--primary);color:var(--primary);background:var(--soft);transform:translateY(-2px)}
.iconbtn.on{border-color:var(--primary);color:var(--primary);background:var(--soft)}
.burger{display:none}
.setwrap{position:relative}
.setpanel{position:absolute;inset-inline-end:0;top:calc(100% + .6rem);width:min(340px,90vw);background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:var(--r);padding:1rem;box-shadow:var(--sh2);z-index:120;display:grid;gap:.8rem;opacity:0;visibility:hidden;transform:translateY(-10px) scale(.98);transition:.24s var(--ease)}
.setpanel.open{opacity:1;visibility:visible;transform:none}
.setpanel h4{font-size:.82rem;letter-spacing:.06em;color:var(--txt2);text-transform:uppercase;display:flex;align-items:center;gap:.45rem}
.srow{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.8rem .85rem;background:var(--chip);border:1px solid var(--line);border-radius:14px;transition:.22s}
.srow:hover{border-color:color-mix(in srgb,var(--primary) 45%,var(--line))}
.sinfo{display:flex;flex-direction:column;gap:.15rem;min-width:0}
.sinfo b{font:700 .93rem/1.4 var(--ffh);color:var(--txt)}
.sinfo span{font-size:.76rem;color:var(--txt2)}
.seg{display:flex;gap:.25rem;padding:.24rem;background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid var(--line);border-radius:var(--pill)}
.seg button{padding:.45rem .85rem;min-height:34px;border-radius:var(--pill);font:700 .82rem/1 var(--ffh);color:var(--txt2);transition:.22s var(--ease)}
.seg button:hover{color:var(--txt)}
.seg button.on{background:linear-gradient(120deg,var(--primary),color-mix(in srgb,var(--primary) 62%,var(--c3)));color:var(--on-c);box-shadow:0 6px 16px -9px var(--primary)}
.sw{display:flex;align-items:center;gap:.6rem;padding:.25rem;border-radius:var(--pill)}
.track{position:relative;width:54px;height:29px;border-radius:var(--pill);background:color-mix(in srgb,var(--bg) 62%,transparent);border:1px solid var(--line);transition:.3s}
.thumb{position:absolute;top:2px;inset-inline-start:2px;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--c1),var(--c2));color:var(--on-c);transition:.35s var(--ease);box-shadow:0 3px 9px rgba(0,0,0,.3)}
html[data-theme=light] .thumb{inset-inline-start:27px;background:linear-gradient(145deg,var(--c5),#e0a52a)}
.thumb .i-sun{display:none}
html[data-theme=light] .thumb .i-sun{display:block}
html[data-theme=light] .thumb .i-moon{display:none}
.thumb .ico{width:13px;height:13px}
.swlab{font:700 .82rem/1 var(--ffh);color:var(--txt);min-width:3.4em}
.setfoot{border-top:1px dashed var(--line);padding-top:.7rem;display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.74rem;color:var(--txt2)}
.kbd{font:700 .7rem/1 var(--ffh);border:1px solid var(--line);border-radius:6px;padding:.28rem .45rem;background:var(--chip);color:var(--txt2)}

/* ═══════════════ درج الهاتف ═══════════════ */
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(4px);z-index:140;opacity:0;visibility:hidden;transition:.3s}
.scrim.open{opacity:1;visibility:visible}
.drawer{position:fixed;inset-block:0;inset-inline-start:0;width:min(340px,88vw);z-index:150;background:var(--bg2);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;transition:transform .34s var(--ease);box-shadow:var(--sh2)}
[dir=rtl] .drawer{transform:translateX(100%)}
[dir=ltr] .drawer{transform:translateX(-100%)}
.drawer.open{transform:none!important}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:1rem 1.1rem;border-bottom:1px solid var(--line);min-height:var(--head)}
.dbody{flex:1;overflow-y:auto;padding:.8rem;display:grid;gap:.3rem;align-content:start}
.dbody>a,.dgrp>summary{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.85rem 1rem;border-radius:12px;color:var(--txt);font:700 .94rem/1.5 var(--ffh);min-height:50px;border:1px solid transparent}
.dbody>a:hover,.dgrp>summary:hover{background:var(--hover);border-color:color-mix(in srgb,var(--primary) 30%,transparent);color:var(--primary)}
.dbody>a.cur{background:var(--soft);border-color:color-mix(in srgb,var(--primary) 45%,transparent);color:var(--primary)}
.dgrp{border:1px solid var(--line);border-radius:12px;background:var(--chip)}
.dgrp>summary{list-style:none;cursor:pointer;color:var(--secondary)}
.dgrp>summary::-webkit-details-marker{display:none}
.dgrp>summary::after{content:"+";font-size:1.2rem;color:var(--primary)}
.dgrp[open]>summary::after{content:"−"}
.dgrp>div{display:grid;padding:.1rem .5rem .6rem}
.dgrp>div a{display:flex;align-items:center;gap:.5rem;padding:.68rem .85rem;border-radius:10px;color:var(--txt2);font-size:.9rem;min-height:44px}
.dgrp>div a::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--primary);opacity:.5}
.dgrp>div a:hover,.dgrp>div a.cur{background:var(--hover);color:var(--txt)}
.dfoot{padding:.9rem 1.1rem;border-top:1px solid var(--line);display:grid;gap:.6rem}

/* ═══════════════ البحث ═══════════════ */
.modal{position:fixed;inset:0;z-index:200;display:none;place-items:start center;padding:clamp(1rem,8vh,6rem) 1rem 2rem;background:var(--scrim);backdrop-filter:blur(8px)}
.modal.open{display:grid;animation:fade .25s var(--ease) both}
.mbox{width:min(660px,100%);background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh2);overflow:hidden;animation:pop .3s var(--ease) both}
.mtop{display:flex;align-items:center;gap:.7rem;padding:.9rem 1.1rem;border-bottom:1px solid var(--line)}
.mtop input{flex:1;background:none;border:none;outline:none;color:var(--txt);font:500 1.02rem/1.6 var(--ffb);min-width:0}
.mtop input::placeholder{color:var(--txt2)}
.mres{max-height:min(52vh,440px);overflow-y:auto;padding:.5rem}
.mres a{display:flex;align-items:center;gap:.8rem;padding:.75rem .9rem;border-radius:12px;color:var(--txt2);border:1px solid transparent}
.mres a .ico{color:var(--primary)}
.mres a b{display:block;font:700 .95rem/1.4 var(--ffh);color:var(--txt)}
.mres a small{font-size:.78rem}
.mres a:hover,.mres a.sel{background:var(--hover);border-color:color-mix(in srgb,var(--primary) 35%,transparent)}
.mempty{padding:1.6rem;text-align:center;color:var(--txt2);font-size:.92rem}
.mfoot{border-top:1px solid var(--line);padding:.65rem 1.1rem;display:flex;gap:.8rem;flex-wrap:wrap;font-size:.75rem;color:var(--txt2)}

/* ═══════════════ الأزرار ═══════════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.82rem 1.4rem;min-height:48px;border-radius:var(--pill);font:700 .93rem/1 var(--ffh);border:1px solid transparent;transition:.26s var(--ease);text-align:center}
.btn--p{background:linear-gradient(120deg,var(--primary),color-mix(in srgb,var(--primary) 60%,var(--c3)));color:var(--on-c);box-shadow:0 14px 32px -18px var(--primary)}
.btn--p:hover{color:var(--on-c);transform:translateY(-3px);box-shadow:0 20px 40px -16px var(--primary)}
.btn--g{background:linear-gradient(120deg,var(--c5),color-mix(in srgb,var(--c5) 70%,var(--c7)));color:var(--on-c);box-shadow:0 14px 32px -18px var(--c5)}
.btn--g:hover{color:var(--on-c);transform:translateY(-3px)}
.btn--o{background:var(--chip);border-color:var(--line);color:var(--txt)}
.btn--o:hover{border-color:var(--primary);color:var(--primary);background:var(--soft);transform:translateY(-3px)}
.btn--sm{padding:.58rem 1.05rem;min-height:42px;font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.6rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.4rem .85rem;border-radius:var(--pill);background:var(--chip);border:1px solid var(--line);color:var(--txt2);font-size:.82rem;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.done{display:inline-flex;align-items:center;gap:.35rem;padding:.3rem .78rem;border-radius:var(--pill);background:color-mix(in srgb,var(--c6) 15%,transparent);border:1px solid color-mix(in srgb,var(--c6) 45%,transparent);color:var(--c6);font:700 .77rem/1.4 var(--ffh)}
.done .ico{width:1rem;height:1rem}

/* ═══════════════ البطاقات ═══════════════ */
.grid{display:grid;gap:1.15rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,288px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,228px),1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(min(100%,192px),1fr))}
.card{--c:var(--c1);position:relative;background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--r);padding:1.45rem;box-shadow:var(--sh1);transition:transform .3s var(--ease),border-color .3s,box-shadow .3s;overflow:hidden;display:flex;flex-direction:column}
.card::before{content:"";position:absolute;inset-inline:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--c),transparent);opacity:0;transition:.3s}
.card:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--c) 55%,var(--line));box-shadow:var(--sh2)}
.card:hover::before{opacity:1}
.card h3{margin-bottom:.55rem}
.card p{font-size:.94rem}
.card .btn{margin-top:auto;align-self:flex-start}
.card p+.btn{margin-top:1.1rem}
.cico{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;margin-bottom:.9rem;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 36%,transparent)}
.cnum{position:absolute;inset-inline-end:1rem;top:.5rem;font:900 2.5rem/1 var(--ffh);color:color-mix(in srgb,var(--txt2) 14%,transparent)}
.panel{background:linear-gradient(150deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(1.3rem,2.5vw,2.1rem);box-shadow:var(--sh1)}
.panel--t{--c:var(--c1);border-color:color-mix(in srgb,var(--c) 36%,var(--line));background:linear-gradient(150deg,color-mix(in srgb,var(--c) 9%,var(--card)),var(--card2))}
.note{border-inline-start:3px solid var(--c5);background:color-mix(in srgb,var(--c5) 8%,transparent);padding:.9rem 1.15rem;border-radius:0 var(--r-sm) var(--r-sm) 0;color:var(--txt2);font-size:.9rem}
.note--i{border-color:var(--c2);background:color-mix(in srgb,var(--c2) 8%,transparent)}
.ticks{display:grid;gap:.5rem;margin-top:.85rem}
.ticks li{position:relative;padding-inline-start:1.5rem;color:var(--txt2);font-size:.93rem;line-height:1.8}
.ticks li::before{content:"";position:absolute;inset-inline-start:0;top:.62em;width:9px;height:9px;border-radius:3px;background:var(--c,var(--c1));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--c1)) 16%,transparent)}

.stat{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--r);padding:1.35rem 1.1rem;text-align:center;position:relative;overflow:hidden;transition:.3s var(--ease)}
.stat::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c5));transform:scaleX(0);transition:transform .4s var(--ease)}

/* ═══════════════ الواجهة ═══════════════ */

.phero{position:relative;padding:clamp(2.2rem,4.6vw,3.6rem) 0 clamp(1.6rem,3vw,2.4rem);border-bottom:1px solid var(--line);overflow:hidden;--c:var(--c1)}
.phero::before{content:"";position:absolute;inset-inline-end:-8%;top:-70%;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 26%,transparent),transparent 66%);filter:blur(28px);pointer-events:none}
.crumbs{margin-bottom:1rem}
.crumbs ol{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;font-size:.84rem;color:var(--txt2)}

/* ═══════════════ الفريق ═══════════════ */
.member{--c:var(--c1);background:linear-gradient(165deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--r-lg);padding:1.5rem;position:relative;overflow:hidden;transition:.32s var(--ease)}
.member::after{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 24%,transparent),transparent 70%);pointer-events:none}

.mhead{display:flex;align-items:center;gap:.9rem;margin-bottom:.9rem}
.av{width:62px;height:62px;flex:none;border-radius:19px;display:grid;place-items:center;font:900 1.22rem/1 var(--ffh);color:var(--on-c);background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff));box-shadow:0 12px 26px -14px var(--c)}

/* ═══════════════ المخططات ═══════════════ */
.dg{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(1.1rem,2.4vw,1.9rem);box-shadow:var(--sh1);position:relative;overflow:hidden}

.orgtop{display:flex;justify-content:center}

.orgrow{display:grid;grid-template-columns:repeat(5,1fr);gap:.85rem;position:relative;padding-top:32px}
.orgrow::before{content:"";position:absolute;top:0;inset-inline:10%;height:2px;background:linear-gradient(90deg,var(--line),var(--primary),var(--line))}
.orgrow .node::before{content:"";position:absolute;top:-32px;inset-inline-start:50%;width:2px;height:32px;background:var(--line)}

.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,176px),1fr));gap:1.55rem}
.fstep{--c:var(--c1);position:relative;background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--r);padding:1.15rem 1.05rem;transition:.3s var(--ease)}

.fstep:last-child::after{display:none}
.fn{display:grid;place-items:center;width:33px;height:33px;border-radius:11px;font:900 .92rem/1 var(--ffh);color:var(--on-c);background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff));margin-bottom:.65rem}
.fstep b{display:block;font:700 .96rem/1.5 var(--ffh);margin-bottom:.3rem}
.fstep p{font-size:.86rem;line-height:1.7}
.fwho{display:inline-block;margin-top:.55rem;font-size:.76rem;color:var(--accent);font-family:var(--ffh);font-weight:700}
.gantt{min-width:680px}
.ghead,.grow{display:grid;grid-template-columns:minmax(168px,214px) 1fr;gap:.8rem;align-items:center}

.gcell:nth-child(1){grid-column:1}.gcell:nth-child(2){grid-column:2}.gcell:nth-child(3){grid-column:3}.gcell:nth-child(4){grid-column:4}.gcell:nth-child(5){grid-column:5;border-inline-end:1px dashed var(--line)}

.gbar.st{background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.18) 0 5px,transparent 5px 10px),linear-gradient(120deg,var(--c),color-mix(in srgb,var(--c) 62%,#fff))}

.pseg{flex-grow:var(--d);flex-basis:0;min-width:0;padding:.85rem .55rem;background:linear-gradient(165deg,color-mix(in srgb,var(--c) 30%,var(--card)),var(--card2));border-top:4px solid var(--c);text-align:center;transition:.3s}

.pleg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,248px),1fr));gap:.75rem;margin-top:1.1rem}
.pitem{display:flex;gap:.75rem;align-items:flex-start;background:var(--chip);border:1px solid var(--line);border-inline-start:4px solid var(--c);border-radius:var(--r-sm);padding:.8rem .95rem}
.pitem b{font:700 .9rem/1.5 var(--ffh);display:block}
.pitem span{font-size:.79rem;color:var(--txt2);font-family:var(--ffh)}
.net{position:relative;aspect-ratio:16/9;min-height:320px}
.netlinks{position:absolute;inset:0;width:100%;height:100%}
.netlinks line{stroke:var(--line);stroke-width:2;stroke-dasharray:7 7;animation:dash 2.8s linear infinite}
.netlinks line.hot{stroke:color-mix(in srgb,var(--c) 70%,transparent)}
.nnode{--c:var(--c1);position:absolute;transform:translate(-50%,-50%);background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:14px;padding:.65rem .85rem;text-align:center;min-width:116px;box-shadow:var(--sh1);transition:.3s var(--ease)}
.nnode:hover{border-color:var(--c);transform:translate(-50%,-50%) scale(1.06);z-index:3}
.nnode b{display:block;font:700 .85rem/1.4 var(--ffh)}
.nnode small{font-size:.71rem;color:var(--txt2)}
.nnode .ico{color:var(--c);margin-bottom:.2rem}
.nhub{border-color:color-mix(in srgb,var(--c) 60%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--c) 20%,var(--card)),var(--card2));box-shadow:0 0 34px -12px var(--c);min-width:148px}
.nhub b{color:var(--c)}
.fish{display:grid}
.bones{display:grid;grid-template-columns:1fr 1fr;gap:1.3rem;padding-inline-end:clamp(1rem,10%,120px)}
.bone{--c:var(--c1);background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-top:3px solid var(--c);border-radius:var(--r);padding:.95rem 1.05rem;position:relative}

.bone li{font-size:.85rem;color:var(--txt2);padding-inline-start:.95rem;position:relative}
.bone li::before{content:"";position:absolute;inset-inline-start:0;top:.75em;width:5px;height:5px;border-radius:50%;background:var(--c)}
.bones.top .bone::after{content:"";position:absolute;bottom:-30px;inset-inline-start:32%;width:2px;height:34px;background:linear-gradient(180deg,var(--c),var(--line));transform:rotate(26deg);transform-origin:top center}
.bones.bot .bone::before{content:"";position:absolute;top:-30px;inset-inline-start:32%;width:2px;height:34px;background:linear-gradient(0deg,var(--c),var(--line));transform:rotate(-26deg);transform-origin:bottom center}
.spine{position:relative;height:8px;margin:30px 0;border-radius:99px}
[dir=rtl] .spine{background:linear-gradient(to left,var(--c7),var(--c5) 30%,var(--c1) 70%,var(--line))}

.spine::before{content:"";position:absolute;inset-inline-start:-2px;top:50%;transform:translateY(-50%);width:0;height:0;border-block:12px solid transparent;border-inline-start:18px solid var(--c7)}
.fprob{position:absolute;inset-inline-start:-4px;top:50%;transform:translate(var(--fx,-100%),-50%);background:linear-gradient(140deg,color-mix(in srgb,var(--c7) 22%,var(--card)),var(--card2));border:1px solid color-mix(in srgb,var(--c7) 60%,transparent);color:var(--c7);border-radius:14px;padding:.65rem .95rem;font:700 .86rem/1.5 var(--ffh);width:max-content;max-width:190px;text-align:center}

.maslow{display:grid;gap:6px;justify-items:center}
.mlvl{width:var(--w);min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:.95rem 1.5rem .75rem;color:var(--on-c);background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 62%,#fff));clip-path:polygon(var(--t) 0,calc(100% - var(--t)) 0,100% 100%,0 100%);transition:.3s var(--ease)}
.mlvl:hover{filter:brightness(1.1);transform:scale(1.02)}
.mlvl b{font:900 .95rem/1.4 var(--ffh)}

.herz{display:grid;grid-template-columns:1fr 1fr;gap:1.3rem}
.hcol{--c:var(--c1);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:var(--r-lg);padding:1.4rem;background:linear-gradient(165deg,color-mix(in srgb,var(--c) 11%,var(--card)),var(--card2))}
.hcol h3{color:var(--c);display:flex;align-items:center;gap:.45rem;margin-bottom:.35rem}

.tstep .en{font-size:.75rem;color:var(--c);font-family:var(--ffh);font-weight:700;display:block;margin-bottom:.45rem}
.tstep p{font-size:.84rem;line-height:1.7}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:1.15rem;align-items:center}
.vsb{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font:900 .85rem/1 var(--ffh);color:var(--accent);border:1px solid color-mix(in srgb,var(--c5) 50%,transparent);background:color-mix(in srgb,var(--c5) 10%,transparent)}

/* ═══════════════ الجداول ═══════════════ */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card2);box-shadow:var(--sh1)}

/* ═══════════════ المعرض ═══════════════ */

.slide{aspect-ratio:16/9;background:linear-gradient(150deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:clamp(.8rem,1.6vw,1.15rem);display:flex;flex-direction:column;gap:.45rem;position:relative;overflow:hidden}
.slide::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:26px 26px;opacity:.7}
.slide>*{position:relative}
.stag{font:700 .63rem/1 var(--ffh);color:var(--accent)}

.srule{height:2px;width:44%;background:linear-gradient(90deg,var(--primary),transparent);border-radius:2px}

.slines i:nth-child(1){width:92%}.slines i:nth-child(2){width:74%}.slines i:nth-child(3){width:83%}
.sbars{display:flex;align-items:flex-end;gap:5px;height:34px;margin-top:auto}

.lb{position:fixed;inset:0;z-index:210;display:none;place-items:center;background:var(--scrim);backdrop-filter:blur(8px);padding:1.4rem}
.lb.open{display:grid;animation:fade .25s var(--ease) both}

.lbclose{position:absolute;inset-inline-end:1.2rem;top:1.2rem;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--txt)}
.lbclose:hover{border-color:var(--c7);color:var(--c7)}
.lbcap{color:var(--txt2);font-size:.89rem;text-align:center}

/* ═══════════════ الأسئلة ═══════════════ */
.faq{display:grid;gap:.85rem}
.faq details{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:border-color .3s}
.faq details[open]{border-color:color-mix(in srgb,var(--c1) 50%,var(--line));box-shadow:0 0 30px -20px var(--c1)}
.faq summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:.85rem;padding:1.1rem 1.25rem;font:700 .99rem/1.6 var(--ffh);min-height:56px}
.faq summary::-webkit-details-marker{display:none}
.faq summary:hover{background:var(--hover);color:var(--secondary)}
.faq .q{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--soft);border:1px solid color-mix(in srgb,var(--c1) 40%,transparent);color:var(--primary);font:900 .8rem/1 var(--ffh)}
.faq summary::after{content:"+";margin-inline-start:auto;font-size:1.35rem;color:var(--primary);line-height:1}
.faq details[open] summary::after{content:"−"}
.faq .a{padding:1rem 0 1.25rem;margin-inline:1.25rem;color:var(--txt2);border-top:1px dashed var(--line)}

/* ═══════════════ التذييل ═══════════════ */
.ftr{position:relative;z-index:1;margin-top:clamp(2rem,5vw,4rem);background:linear-gradient(180deg,color-mix(in srgb,var(--bg2) 70%,transparent),var(--bg2));border-top:1px solid var(--line);padding-top:clamp(2.2rem,4vw,3.2rem)}
.ftr::before{content:"";position:absolute;inset-inline:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--c1),var(--c5),var(--c3),transparent)}
.fgrid{display:grid;grid-template-columns:1.5fr repeat(3,1fr) 1.4fr;gap:1.9rem;padding-bottom:2.2rem}
.fcol h3{font-size:.96rem;margin-bottom:.9rem;position:relative;padding-bottom:.55rem}
.fcol h3::after{content:"";position:absolute;inset-inline-start:0;bottom:0;width:32px;height:2px;background:var(--primary);border-radius:2px}
.fcol li{margin-bottom:.5rem}
.fcol a{color:var(--txt2);font-size:.89rem;display:inline-flex;align-items:center;gap:.4rem}
.fcol a::before{content:"‹";color:var(--line);transition:.2s}
[dir=ltr] .fcol a::before{content:"›"}

.fcol a:hover::before{color:var(--primary)}
.fbrand p{font-size:.88rem;margin-top:.75rem;max-width:34ch}
.ffacts li{font-size:.85rem;color:var(--txt2);display:flex;gap:.5rem;align-items:flex-start;line-height:1.7}
.ffacts .ico{width:1.02rem;height:1.02rem;color:var(--primary);margin-top:.35rem}
.fbot{border-top:1px solid var(--line);padding:1.2rem 0 2rem;display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between}
.fbot p{font-size:.84rem;max-width:70ch}
.totop{display:inline-flex;align-items:center;gap:.45rem;padding:.6rem 1.1rem;border-radius:var(--pill);border:1px solid var(--line);color:var(--txt2);font:700 .84rem/1 var(--ffh);min-height:44px;transition:.24s}
.totop:hover{border-color:var(--primary);color:var(--primary);background:var(--soft)}

/* ═══════════════ التنبيهات ═══════════════ */
.toasts{position:fixed;inset-block-end:1.2rem;inset-inline-end:1.2rem;z-index:300;display:grid;gap:.55rem;pointer-events:none}
.toast{display:flex;align-items:center;gap:.6rem;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-inline-start:3px solid var(--c6);border-radius:14px;padding:.8rem 1.1rem;box-shadow:var(--sh2);font:600 .88rem/1.5 var(--ffb);color:var(--txt);animation:slidein .3s var(--ease) both;max-width:min(360px,88vw)}
.toast .ico{color:var(--c6)}
.toast.out{animation:slideout .3s var(--ease) both}

/* ═══════════════ الحركات ═══════════════ */
@keyframes hue{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(26px,-22px) scale(1.08)}66%{transform:translate(-20px,18px) scale(.95)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-16px) rotate(8deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dash{to{stroke-dashoffset:-28}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slideout{to{opacity:0;transform:translateY(10px)}}
.anim{animation:pop .65s var(--ease) both;animation-delay:calc(var(--i,0) * 85ms)}

/* ═══════════════ الاستجابة ═══════════════ */

  .card,.panel,.member{padding:1.1rem}

    card({icon:'bulb',title:t('الابتكار','Innovation'),c:'var(--c4)',text:t('انخفاض تكلفة التجربة يتيح اختبار أفكار جديدة بسرعة وتطوير منتجات وخدمات باستمرار.','Cheaper experimentation lets teams test new ideas quickly and keep improving products and services.')}),
    card({icon:'lock',title:t('الخصوصية','Privacy'),c:'var(--c5)',text:t('تزايد جمع البيانات يفرض مسؤولية واضحة في حماية المعلومات الشخصية وتحديد صلاحيات الوصول.','More data collection creates a clear duty to protect personal information and control access.')}),
    card({icon:'shield',title:t('الأمن السيبراني','Cybersecurity'),c:'var(--c7)',text:t('اتساع سطح الاتصال الرقمي يزيد الحاجة إلى التحديثات والنسخ الاحتياطية والوعي بالممارسات الآمنة.','A wider digital surface increases the need for updates, backups and safe-practice awareness.')}),
    card({icon:'gear',title:t('التغيرات في الوظائف','Changing jobs'),c:'var(--c3)',text:t('تتغير طبيعة بعض المهام وتظهر أدوار جديدة، مما يتطلب إعادة تأهيل وتوزيعًا مختلفًا للمسؤوليات.','Some tasks change and new roles appear, requiring reskilling and different responsibility splits.')}),
    card({icon:'book',title:t('التعلم المستمر','Continuous learning'),text:t('الحاجة الدائمة إلى اكتساب مهارات جديدة تجعل التطوير المهني المستمر جزءًا من العمل اليومي.','The constant need for new skills makes continuous professional development part of daily work.')})])
   +'<div class="row"><a class="btn btn--p" href="#/innovation">'+t('الابتكار الرقمي','Digital innovation')+'</a><a class="btn btn--o" href="#/development">'+t('التطوير المهني المستمر','Continuous development')+'</a><a class="btn btn--o" href="#/references">'+t('المصادر والمراجع','References')+'</a></div>'});

PAGES.ai=function(){
  return phero({c:'var(--c1)',eyebrow:t('التقنية 01','Technology 01'),icon:'ai',parent:[t('التقنيات الناشئة','Emerging Technologies'),'#/technologies'],
   title:t('الذكاء الاصطناعي ','Artificial Intelligence ')+'<span class="grad"><bdi>(AI)</bdi></span>',
   lead:t('مجموعة من التقنيات التي تمكّن الأنظمة من تنفيذ مهام تحتاج عادةً إلى الذكاء البشري، مثل الفهم والتحليل والتعرّف على الأنماط وتوليد المحتوى ودعم اتخاذ القرار.','A set of technologies enabling systems to perform tasks that usually require human intelligence: understanding, analysis, pattern recognition, content generation and decision support.')})
  +sec({body:'<div class="grid g2">'
   +'<article class="panel rv"><div class="cico">'+ico('ai','lg')+'</div><h2>'+t('تعريف الذكاء الاصطناعي','Defining AI')+'</h2><p class="mt-s">'+t('الذكاء الاصطناعي مجال يهدف إلى بناء أنظمة قادرة على أداء مهام إدراكية ترتبط عادةً بالإنسان: فهم اللغة، والتعرّف على الصور، والتنبؤ، والترجمة، والتلخيص، واقتراح الحلول. ويعمل النظام بالاعتماد على بيانات ونماذج رياضية تتعلم العلاقات والأنماط بدلًا من اتباع قواعد ثابتة فقط.','AI aims to build systems able to perform cognitive tasks usually associated with people: language understanding, image recognition, prediction, translation, summarization and suggesting solutions. Systems rely on data and mathematical models that learn relationships and patterns rather than only following fixed rules.')+'</p><p class="mt-s">'+t('ولا يعني ذلك أن النظام «يفهم» كما يفهم الإنسان؛ بل إنه ينتج مخرجات احتمالية بناءً على ما تدرب عليه، ولهذا تبقى المراجعة البشرية ضرورية.','This does not mean the system “understands” as a person does; it produces probabilistic outputs based on its training, which is why human review remains essential.')+'</p></article>'
   +'<article class="panel panel--t rv"><div class="cico">'+ico('gear','lg')+'</div><h2>'+t('آلية العمل بصورة مبسطة','How it works, simply')+'</h2><p class="mt-s">'+t('يبدأ النظام باستقبال مدخلات (نص، صورة، صوت، أو بيانات رقمية)، ثم يعالجها عبر نموذج مدرَّب لاستخراج الأنماط، ثم ينتج مخرجات مثل إجابة أو تصنيف أو توصية. وتُراجع هذه المخرجات بشريًا قبل اعتمادها في السياقات المهمة.','The system receives inputs (text, image, audio or numeric data), processes them through a trained model to extract patterns, then produces outputs such as an answer, a classification or a recommendation. These outputs are reviewed by people before being relied on in important contexts.')+'</p>'
   +'<p class="subh">'+t('مقدمة في تعلم الآلة','Introduction to machine learning')+'</p><p>'+t('تعلم الآلة أسلوب لبناء هذه النماذج: بدلًا من كتابة كل قاعدة يدويًا، يُعرض على النظام عدد كبير من الأمثلة، فيستنتج منها علاقات إحصائية يستخدمها لاحقًا للتعامل مع حالات جديدة. وتتحسن الجودة كلما تحسنت جودة البيانات وتمثيلها للحالة الواقعية.','Machine learning builds these models: instead of writing every rule by hand, the system is shown many examples and infers statistical relationships it later applies to new cases. Quality improves as the data better represents reality.')+'</p></article></div>'})
  +sec({alt:true,eyebrow:t('مخطط توضيحي','Diagram'),icon:'flow',title:t('كيف يعمل نظام الذكاء الاصطناعي؟','How an AI system works'),
   body:dg(t('المدخلات ← المعالجة ← المخرجات ← المراجعة البشرية','Inputs → AI processing → Outputs → Human review'),flow([
    {t:t('المدخلات','Inputs'),d:t('نصوص أو صور أو صوت أو بيانات رقمية تُقدَّم إلى النظام.','Text, images, audio or numeric data provided to the system.'),c:'var(--c2)'},
    {t:t('معالجة الذكاء الاصطناعي','AI processing'),d:t('نموذج مدرَّب يحلّل المدخلات ويستخرج الأنماط والعلاقات.','A trained model analyses the inputs and extracts patterns.'),c:'var(--c1)'},
    {t:t('المخرجات','Outputs'),d:t('إجابة أو تصنيف أو توصية أو محتوى مُولَّد.','An answer, classification, recommendation or generated content.'),c:'var(--c3)'},
    {t:t('المراجعة البشرية','Human review'),d:t('التحقق من الدقة والملاءمة قبل الاعتماد النهائي.','Checking accuracy and suitability before final reliance.'),c:'var(--c6)'}
   ]),t('الوصف النصي: المخرجات ليست قرارًا نهائيًا؛ إذ تُعرض على المراجعة البشرية التي تتحقق من صحتها وتعيد صياغتها عند الحاجة، وتبقى المسؤولية عن القرار النهائي للإنسان.','Text description: outputs are not final decisions; human review verifies and rewrites them when needed, and responsibility for the final decision stays with people.'),'ai')})
  +sec({eyebrow:t('التطبيقات','Applications'),icon:'grid',title:t('أين يظهر الذكاء الاصطناعي؟','Where AI appears'),
   body:grid(3,[card({icon:'mic',title:t('المساعدات الذكية','Smart assistants'),text:t('أنظمة تفهم الأوامر الصوتية أو النصية وتنفّذ مهامًا مثل التذكير والبحث وضبط الأجهزة.','Systems that understand voice or text commands and perform tasks such as reminders, search and device control.')}),
    card({icon:'spark',title:L('ChatGPT'),c:'var(--c4)',text:t('نموذج محادثة يولّد نصوصًا ويجيب عن الأسئلة ويساعد في الشرح والتلخيص والصياغة.','A conversational model that generates text, answers questions and helps with explanation, summarization and drafting.')}),
    card({icon:'search',title:t('التعرف على الصور','Image recognition'),c:'var(--c2)',text:t('تصنيف الصور واكتشاف العناصر فيها، ويستخدم في الفرز والجودة والبحث البصري.','Classifying images and detecting objects, used in sorting, quality control and visual search.')}),
    card({icon:'gear',title:t('أتمتة الأعمال','Business automation'),c:'var(--c5)',text:t('تنفيذ المهام المتكررة مثل تصنيف الطلبات واستخراج البيانات من المستندات.','Handling repetitive tasks such as ticket triage and extracting data from documents.')}),
    card({icon:'doc',title:t('المساعدة في البرمجة','Coding assistance'),c:'var(--c3)',text:t('اقتراح مقاطع برمجية وشرح الأخطاء وتسريع كتابة الاختبارات والتوثيق.','Suggesting code, explaining errors and speeding up tests and documentation.')}),
    card({icon:'chart',title:t('أدوات الإنتاجية','Productivity tools'),c:'var(--c6)',text:t('تلخيص الاجتماعات، وتنظيم المهام، وصياغة المراسلات، وتحضير مسودات العروض.','Summarizing meetings, organizing tasks, drafting correspondence and preparing deck outlines.')}),
    card({icon:'book',title:t('التطبيقات التعليمية','Educational uses'),c:'var(--c7)',text:t('شرح المفاهيم بمستويات مختلفة، وتوليد تمارين، وتقديم تغذية راجعة أولية للمتعلم.','Explaining concepts at different levels, generating exercises and giving initial learner feedback.')})])})
  +sec({alt:true,eyebrow:t('التوازن','Balance'),icon:'scale',title:t('الفوائد والتحديات','Benefits and challenges'),
   body:benefitChallenge(t('الفوائد','Benefits'),[t('زيادة الإنتاجية.','Higher productivity.'),t('أتمتة المهام المتكررة.','Automating repetitive tasks.'),t('معالجة المعلومات بسرعة.','Fast information processing.'),t('دعم اتخاذ القرارات.','Decision support.'),t('تخصيص الخدمات.','Personalized services.')],
    t('التحديات','Challenges'),[t('المعلومات غير الدقيقة.','Inaccurate information.'),t('الخصوصية.','Privacy.'),t('التحيز.','Bias.'),t('تكاليف التطبيق.','Implementation costs.'),t('الاعتماد المفرط على التكنولوجيا.','Over-reliance on technology.'),t('التغيرات في الوظائف.','Changes in jobs.')])
   +examplePanel(t('مثال عملي: دعم العملاء','Practical example: customer support'),t('يستطيع نظام دعم العملاء المعتمد على الذكاء الاصطناعي التعامل مع الاستفسارات العامة والمتكررة — مثل مواعيد العمل، وحالة الطلب، وطريقة الإرجاع — فيقدّم إجابة فورية على مدار الساعة. وعندما يواجه حالة معقدة أو حساسة، يحوّلها النظام إلى الموظفين مع ملخص للمحادثة، فيتفرغ الفريق للحالات التي تحتاج حكمًا بشريًا. هكذا تتحسن سرعة الاستجابة دون التخلي عن المسؤولية البشرية.','An AI-based customer support system can handle common, repetitive enquiries — opening hours, order status, return procedure — giving instant answers around the clock. When a case is complex or sensitive, it hands over to staff with a conversation summary, freeing the team for cases that need human judgment. Response speed improves without giving up human responsibility.'))})
  +responsibleSection('responsible-ai',false)
  +otherTechs('ai');
};

PAGES.vr=function(){
  return phero({c:'var(--c4)',eyebrow:t('التقنية 02','Technology 02'),icon:'vr',parent:[t('التقنيات الناشئة','Emerging Technologies'),'#/technologies'],
   title:t('الواقع الافتراضي ','Virtual Reality ')+'<span class="grad"><bdi>(VR)</bdi></span>',
   lead:t('بيئات رقمية غامرة تسمح للمستخدم بالاستكشاف والتفاعل مع عالم افتراضي ثلاثي الأبعاد، بدلًا من الاكتفاء بمشاهدته على شاشة مسطحة.','Immersive digital environments that let users explore and interact with a three-dimensional virtual world instead of only watching it on a flat screen.')})
  +sec({body:'<div class="grid g2">'
   +'<article class="panel rv"><div class="cico">'+ico('vr','lg')+'</div><h2>'+t('تعريف الواقع الافتراضي','Defining VR')+'</h2><p class="mt-s">'+t('الواقع الافتراضي تقنية تنشئ بيئة رقمية كاملة تحيط بالمستخدم بصريًا وسمعيًا، وتمنحه إحساسًا بالتواجد داخلها. ويختلف عن الواقع المعزز الذي يضيف عناصر رقمية فوق العالم الحقيقي؛ فالواقع الافتراضي يستبدل المشهد المحيط بمشهد رقمي بالكامل.','VR creates a complete digital environment surrounding the user visually and aurally, giving a sense of presence inside it. It differs from augmented reality, which overlays digital elements on the real world; VR replaces the surrounding scene entirely.')+'</p><p class="mt-s">'+t('وتكمن قيمته في تحويل المعلومة من وصف نظري إلى تجربة يعيشها المستخدم، وهو ما يفيد في التعليم والتدريب واستكشاف الأماكن.','Its value lies in turning information from abstract description into an experience the user lives through — useful in education, training and exploring places.')+'</p></article>'
   +'<article class="panel panel--t rv"><div class="cico">'+ico('gear','lg')+'</div><h2>'+t('آلية عمل التقنية','How the technology works')+'</h2><p class="mt-s">'+t('تعرض النظارة صورتين مختلفتين قليلًا — واحدة لكل عين — لتوليد إحساس بالعمق. وتتتبع مستشعرات الحركة اتجاه الرأس فتُحدَّث الصورة فورًا بما يوافق حركة المستخدم، مما يخلق إحساسًا بالتواجد. وتضيف أدوات التحكم إمكانية التفاعل بالإمساك والتأشير والتنقل داخل البيئة.','The headset shows two slightly different images — one per eye — to create depth. Motion sensors track head direction so the image updates instantly with the user\u2019s movement, creating presence. Controllers add interaction: grabbing, pointing and moving inside the environment.')+'</p>'
   +'<ul class="ticks mt-s"><li>'+t('عرض مجسّم لكل عين لإنتاج العمق.','A stereoscopic image per eye to produce depth.')+'</li><li>'+t('تتبع حركة الرأس لتحديث المشهد لحظيًا.','Head tracking to update the scene in real time.')+'</li><li>'+t('معدل تحديث مرتفع لتقليل التأخير والشعور بعدم الراحة.','A high refresh rate to reduce latency and discomfort.')+'</li><li>'+t('صوت مكاني يعزز الإحساس بالاتجاه والمسافة.','Spatial audio reinforcing direction and distance.')+'</li></ul></article></div>'})
  +sec({alt:true,eyebrow:t('المكوّنات والتطبيقات','Components and uses'),icon:'grid',title:t('الأجهزة ومجالات الاستخدام','Hardware and fields of use'),
   body:grid(3,[card({icon:'vr',title:t('نظارات الواقع الافتراضي','VR headsets'),text:t('الجهاز الأساسي الذي يعرض البيئة الرقمية ويتتبع حركة الرأس، ومنها أجهزة مستقلة وأخرى تتصل بالحاسوب.','The core device displaying the digital environment and tracking head movement; some are standalone, others connect to a computer.')}),
    card({icon:'gear',title:t('أدوات التحكم','Controllers'),c:'var(--c2)',text:t('وحدات يدوية تتيح التأشير والإمساك والتنقل والتفاعل مع العناصر داخل البيئة الافتراضية.','Handheld units enabling pointing, grabbing, moving and interacting with objects in the virtual environment.')}),
    card({icon:'slides',title:t('الألعاب','Games'),c:'var(--c3)',text:t('تجارب تفاعلية غامرة تمنح اللاعب حضورًا داخل العالم الرقمي بدل مشاهدته من الخارج.','Immersive interactive experiences that place the player inside the digital world rather than watching from outside.')}),
    card({icon:'book',title:t('التعليم','Education'),c:'var(--c5)',text:t('شرح المفاهيم المجردة عبر نماذج ثلاثية الأبعاد يمكن تفكيكها واستكشافها من الداخل.','Explaining abstract concepts through 3D models that can be taken apart and explored from inside.')}),
    card({icon:'shield',title:t('المحاكاة التدريبية','Training simulation'),c:'var(--c6)',text:t('التدرب على إجراءات عملية في بيئة آمنة تسمح بالخطأ والتكرار دون مخاطر واقعية.','Practising practical procedures in a safe environment that allows mistakes and repetition without real risk.')}),
    card({icon:'pin',title:t('الجولات الافتراضية','Virtual tours'),c:'var(--c7)',text:t('زيارة المواقع والمعالم والمتاحف عن بعد والتنقل بين نقاطها بشكل تفاعلي.','Visiting sites, landmarks and museums remotely and moving between viewpoints interactively.')}),
    card({icon:'spark',title:t('التجارب الرقمية التفاعلية','Interactive digital experiences'),c:'var(--c1)',text:t('عروض منتجات ومعارض وتصاميم معمارية يمكن استكشافها قبل تنفيذها على أرض الواقع.','Product showcases, exhibitions and architectural designs that can be explored before being built.')})])})
  +sec({eyebrow:t('التوازن','Balance'),icon:'scale',title:t('الفوائد والتحديات','Benefits and challenges'),
   body:benefitChallenge(t('الفوائد','Benefits'),[t('تحسين التفاعل مع المحتوى.','Better engagement with content.'),t('توفير بيئات تدريب محاكية.','Simulated training environments.'),t('دعم التعلم.','Supporting learning.'),t('استكشاف الأماكن عن بعد.','Exploring places remotely.'),t('تقديم تجارب تعليمية جديدة.','New kinds of learning experiences.')],
    t('التحديات','Challenges'),[t('تكاليف الأجهزة.','Hardware costs.'),t('متطلبات التشغيل.','Runtime requirements.'),t('إمكانية الوصول.','Accessibility.'),t('الشعور بالدوار أو عدم الراحة لدى بعض المستخدمين.','Motion sickness or discomfort for some users.')])
   +examplePanel(t('مثال عملي','Practical example'),t('يمكن استخدام الواقع الافتراضي في استكشاف بيئة تعليمية — مثل مختبر افتراضي أو موقع أثري — حيث يتنقل المستخدم بين عناصر المشهد ويقترب منها ويتفاعل معها. كما يمكن إجراء محاكاة تدريبية لإجراء تشغيلي متكرر: يتدرب المستخدم على الخطوات بالترتيب الصحيح داخل بيئة آمنة، ويعيد المحاولة عند الخطأ دون أي تكلفة أو خطر، حتى يتقن الإجراء قبل تطبيقه في الواقع.','VR can be used to explore a learning environment — a virtual lab or an archaeological site — where the user moves between scene elements, approaches them and interacts. It can also run a training simulation of a repeated operating procedure: the user practises the steps in the correct order in a safe environment and retries after mistakes at no cost or risk, mastering the procedure before applying it in reality.'))})
  +otherTechs('vr');
};

PAGES.iot=function(){
  return phero({c:'var(--c2)',eyebrow:t('التقنية 03','Technology 03'),icon:'iot',parent:[t('التقنيات الناشئة','Emerging Technologies'),'#/technologies'],
   title:t('إنترنت الأشياء ','Internet of Things ')+'<span class="grad"><bdi>(IoT)</bdi></span>',
   lead:t('كيف تتصل الأجهزة بالإنترنت وتتبادل البيانات من خلال الشبكات، لتتحول الأشياء اليومية إلى أنظمة قابلة للمراقبة والتحكم الآلي.','How devices connect to the internet and exchange data over networks, turning everyday objects into systems that can be monitored and controlled automatically.')})
  +sec({body:'<div class="grid g2">'
   +'<article class="panel rv"><div class="cico">'+ico('iot','lg')+'</div><h2>'+t('تعريف إنترنت الأشياء','Defining IoT')+'</h2><p class="mt-s">'+t('إنترنت الأشياء شبكة من الأجهزة المادية المزوّدة بمستشعرات وبرمجيات واتصال شبكي، تجمع البيانات من محيطها وتتبادلها مع أنظمة أخرى. وتتيح هذه البيانات مراقبة الحالة عن بعد واتخاذ إجراءات آلية أو يدوية بناءً عليها.','IoT is a network of physical devices equipped with sensors, software and connectivity that collect data from their surroundings and exchange it with other systems. This data enables remote monitoring and automatic or manual action.')+'</p><p class="mt-s">'+t('وتكمن قيمته في تحويل الأحداث الفيزيائية — الحرارة، الحركة، الاستهلاك، الرطوبة — إلى بيانات رقمية قابلة للقياس والتحليل.','Its value is turning physical events — temperature, motion, consumption, humidity — into measurable, analysable digital data.')+'</p></article>'
   +'<article class="panel panel--t rv"><div class="cico">'+ico('gear','lg')+'</div><h2>'+t('المكوّنات الأساسية','Core components')+'</h2><ul class="ticks">'

    +'<div class="nnode" style="left:83%;top:80%;--c:var(--c4)">'+ico('search')+'<b>'+t('المراقبة عن بعد','Remote monitoring')+'</b><small>'+t('عرض الحالة والتحكم','status view and control')+'</small></div></div>',

  +sec({eyebrow:t('التطبيقات','Applications'),icon:'home',title:t('أين يُستخدم إنترنت الأشياء؟','Where IoT is used'),

    card({icon:'chart',title:t('مراقبة درجة الحرارة','Temperature monitoring'),c:'var(--c2)',text:t('قياس مستمر للحرارة والرطوبة مع تنبيهات عند تجاوز الحدود.','Continuous temperature and humidity measurement with threshold alerts.')}),

PAGES.robotics=function(){
  return phero({c:'var(--c5)',eyebrow:t('التقنية 04','Technology 04'),icon:'robot',parent:[t('التقنيات الناشئة','Emerging Technologies'),'#/technologies'],

  +sec({body:'<div class="grid g2">'
   +'<article class="panel rv"><div class="cico">'+ico('robot','lg')+'</div><h2>'+t('تعريف الروبوتات','Defining robotics')+'</h2><p class="mt-s">'+t('الروبوتات مجال يجمع بين الهندسة الميكانيكية والإلكترونيات والبرمجة لبناء آلات قادرة على استشعار محيطها ومعالجة المعلومات وتنفيذ حركة مادية. ويعمل الروبوت وفق برنامج يحدد خطوات المهمة، وقد يتكيف مع المتغيرات عبر المستشعرات.','Robotics combines mechanical engineering, electronics and programming to build machines that sense their surroundings, process information and perform physical motion. A robot follows a program defining the task steps and can adapt to changes through sensors.')+'</p><p class="mt-s">'+t('وتكمن قيمتها في أداء المهام المتكررة بدقة ثابتة لا تتأثر بالتعب، وفي العمل داخل بيئات يصعب على الإنسان العمل فيها بأمان.','Its value is performing repetitive tasks with constant precision unaffected by fatigue, and working in environments where people cannot operate safely.')+'</p></article>'
   +'<article class="panel panel--t rv"><div class="cico">'+ico('gear','lg')+'</div><h2>'+t('الآليات المؤتمتة','Automated mechanisms')+'</h2><p class="mt-s">'+t('تتكون المنظومة الروبوتية عادةً من مستشعرات تجمع المعلومات، ووحدة تحكم تعالجها وتقرر الخطوة التالية، ومشغّلات ميكانيكية تنفّذ الحركة. وتُبرمج تسلسلات المهام مسبقًا، مع وجود أنظمة سلامة توقف الحركة عند وجود عائق أو خطر.','A robotic system usually consists of sensors gathering information, a control unit processing it and deciding the next step, and mechanical actuators executing motion. Task sequences are programmed in advance, with safety systems that stop motion when an obstacle or hazard appears.')+'</p>'
   +'<ul class="ticks mt-s"><li>'+t('استشعار: كاميرات ومستشعرات موضع وقوة.','Sensing: cameras, position and force sensors.')+'</li><li>'+t('معالجة: منطق تحكم يحدد التسلسل والتوقيت.','Processing: control logic defining sequence and timing.')+'</li><li>'+t('تنفيذ: أذرع ومحركات وأدوات إمساك.','Actuation: arms, motors and grippers.')+'</li><li>'+t('سلامة: حدود حركة وحساسات توقف طارئ.','Safety: motion limits and emergency-stop sensors.')+'</li></ul></article></div>'})
  +sec({alt:true,eyebrow:t('المجالات','Fields'),icon:'grid',title:t('أين تعمل الروبوتات؟','Where robots work'),
   body:grid(3,[card({icon:'gear',title:t('الروبوتات الصناعية','Industrial robots'),text:t('أذرع مبرمجة تنفّذ اللحام والطلاء والمناولة والتجميع داخل المصانع.','Programmed arms performing welding, painting, handling and assembly inside factories.')}),
    card({icon:'heart',title:t('تطبيقات المستشفيات','Hospital applications'),c:'var(--c7)',text:t('نقل المستلزمات والعيّنات، ودعم بعض الإجراءات بدقة عالية تحت إشراف مختصين.','Transporting supplies and samples, and supporting certain procedures with high precision under specialist supervision.')}),
    card({icon:'grid',title:t('التصنيع','Manufacturing'),c:'var(--c3)',text:t('تنفيذ خطوات إنتاجية متسلسلة بمعايير جودة ثابتة على مدار الساعة.','Executing sequential production steps to constant quality standards around the clock.')}),
    card({icon:'flow',title:t('خطوط الإنتاج','Production lines'),c:'var(--c2)',text:t('تكامل الروبوتات مع سيور النقل وأنظمة الفحص لتسريع دورة الإنتاج.','Integrating robots with conveyors and inspection systems to speed up the production cycle.')}),
    card({icon:'clock',title:t('المهام المتكررة','Repetitive tasks'),c:'var(--c4)',text:t('تولّي الأعمال ذات التكرار العالي لتخفيف الحمل عن العاملين.','Taking on highly repetitive work to reduce the load on workers.')}),
    card({icon:'users',title:t('التعاون بين الإنسان والروبوت','Human–robot collaboration'),c:'var(--c6)',text:t('روبوتات تعاونية تعمل بجانب الإنسان ضمن مساحة مشتركة مع أنظمة أمان.','Collaborative robots working alongside people in a shared space with safety systems.')})])})
  +sec({eyebrow:t('التوازن','Balance'),icon:'scale',title:t('الفوائد والتحديات','Benefits and challenges'),
   body:benefitChallenge(t('الفوائد','Benefits'),[t('الدقة.','Precision.'),t('زيادة الإنتاجية.','Higher productivity.'),t('اتساق جودة العمل.','Consistent work quality.'),t('تقليل تعرض العاملين لبعض المخاطر المهنية.','Reducing worker exposure to certain occupational hazards.'),t('أتمتة المهام المتكررة.','Automating repetitive tasks.')],
    t('التحديات','Challenges'),[t('تكاليف التركيب.','Installation costs.'),t('الصيانة.','Maintenance.'),t('الحاجة إلى خبرات تقنية.','The need for technical expertise.'),t('تغير بعض الوظائف.','Changes in some jobs.'),t('متطلبات السلامة.','Safety requirements.')])
   +examplePanel(t('مثال عملي: التصنيع والتجميع','Practical example: manufacturing and assembly'),t('في خطوط تصنيع المنتجات، تتولى الأذرع الروبوتية التقاط القطع ووضعها في الموضع الصحيح ثم تثبيتها أو لحامها، بينما تتولى أنظمة الفحص التحقق من الأبعاد والجودة بعد كل خطوة. ولأن الحركة مبرمجة بدقة، يتكرر الإجراء نفسه بالمواصفات ذاتها في كل دورة إنتاج. ويتحول دور العامل من التنفيذ اليدوي المتكرر إلى مراقبة العملية وضبط الإعدادات ومعالجة الحالات الاستثنائية — وهو ما يتطلب تدريبًا وخبرات تقنية جديدة.','On product manufacturing lines, robotic arms pick parts, place them correctly and fasten or weld them, while inspection systems verify dimensions and quality after each step. Because motion is precisely programmed, the same action repeats to the same specification every cycle. The worker\u2019s role shifts from repetitive manual execution to monitoring the process, adjusting settings and handling exceptions — which requires training and new technical expertise.'))})
  +otherTechs('robotics');
};

PAGES.cloud=function(){

   +'<li><strong>'+t('البنية التحتية السحابية:','Cloud infrastructure:')+'</strong> '+t('موارد حوسبة وشبكات مُدارة من المزوّد.','compute and networking managed by the provider.')+'</li></ul></article></div>'})
  +sec({alt:true,eyebrow:t('نماذج الخدمة','Service models'),icon:'grid',title:t('ثلاثة نماذج رئيسية','Three main models'),

    card({icon:'gear',title:t('البنية التحتية كخدمة (IaaS)','Infrastructure as a Service (IaaS)'),c:'var(--c1)',text:t('موارد حوسبة وتخزين وشبكات افتراضية يتحكم بها المستخدم على مستوى نظام التشغيل وما فوقه.','Virtual compute, storage and networking controlled by the user from the operating system upward.')}),

  if(!list.length){box.innerHTML='<p class="mempty">'+t('لا توجد نتائج مطابقة. جرّب كلمة أخرى مثل «تقنيات» أو «فريق».','No matching results. Try another word such as “team” or “technologies”.')+'</p>';return;}
  box.innerHTML=list.map(function(x,i){
    return '<a href="'+href(x.r)+'" data-res="'+i+'"'+(i===0?' class="sel"':'')+'>'+ico(ICON_OF[x.r])+'<span><b>'+(LANG==='ar'?x.ar:x.en)+'</b><small>'+(LANG==='ar'?x.en:x.ar)+'</small></span></a>';
  }).join('');
}
function moveSel(d){
  var items=$('#searchRes').querySelectorAll('a[data-res]');
  if(!items.length)return;
  searchSel=(searchSel+d+items.length)%items.length;
  Array.prototype.forEach.call(items,function(a,i){a.classList.toggle('sel',i===searchSel);});
  items[searchSel].scrollIntoView({block:'nearest'});
}

/* ═════════ العرض والتوجيه ═════════ */
var io=null;
function reveal(){
  var els=document.querySelectorAll('#main .rv');
  if(!('IntersectionObserver' in window)||window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    Array.prototype.forEach.call(els,function(e){e.classList.add('in');});return;
  }
  if(io)io.disconnect();
  io=new IntersectionObserver(function(entries){
    entries.forEach(function(en){if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);}});
  },{rootMargin:'0px 0px -6% 0px',threshold:.04});
  Array.prototype.forEach.call(els,function(e){io.observe(e);});
  setTimeout(function(){Array.prototype.forEach.call(document.querySelectorAll('#main .rv'),function(e){e.classList.add('in');});},1400);
}
function parseHash(){
  var h=location.hash.replace(/^#\/?/,'');
  var parts=h.split('?'),r=parts[0]||'home',sub=null;
  if(parts[1]){var m=parts[1].match(/s=([^&]+)/);if(m)sub=m[1];}
  if(!PAGES[r])r='home';
  return {r:r,s:sub};
}
function render(scrollTarget){
  var p=parseHash();ROUTE=p.r;
  root.setAttribute('lang',LANG);root.setAttribute('data-lang',LANG);root.setAttribute('dir',LANG==='ar'?'rtl':'ltr');
  root.setAttribute('data-theme',THEME);
  document.title='IT Professionals | '+label(ROUTE)+(LANG==='ar'?' — التقنيات الناشئة والابتكار الرقمي':' — Emerging Technologies & Digital Innovation');
  $('#brandSub').textContent=t('التقنيات الناشئة والابتكار الرقمي','Emerging Technologies & Digital Innovation');
  $('#skip').textContent=t('تجاوز إلى المحتوى الرئيسي','Skip to main content');
  $('#searchBtn').setAttribute('aria-label',t('بحث','Search'));$('#searchBtn').title=t('بحث','Search')+' (Ctrl+K)';
  $('#setBtn').setAttribute('aria-label',t('الإعدادات','Settings'));$('#setBtn').title=t('الإعدادات','Settings');
  $('#burger').setAttribute('aria-label',t('القائمة','Menu'));
  $('#drawerClose').setAttribute('aria-label',t('إغلاق','Close'));
  $('#lbClose').setAttribute('aria-label',t('إغلاق','Close'));
  $('#searchClose').setAttribute('aria-label',t('إغلاق','Close'));
  buildNav();buildDrawer();buildSettings();buildFooter();
  $('#main').innerHTML=PAGES[ROUTE]();
  bindPage();reveal();
  var meta=document.querySelector('meta[name=description]');
  if(meta)meta.setAttribute('content',LANG==='ar'?'الموقع التعريفي والتوثيقي لمشروع فريق IT Professionals لتمثيل شركة OptiTic في مؤتمر ICTI-AFB 2026.':'The introductory and documentary site for the IT Professionals team project representing OptiTic at ICTI-AFB 2026.');
  if(p.s){
    var el=document.getElementById(p.s);
    if(el){setTimeout(function(){el.scrollIntoView({behavior:'smooth',block:'start'});},90);return;}
  }
  if(scrollTarget!==false)window.scrollTo({top:0,behavior:'auto'});
}
function bindPage(){
  var f=$('#workFilters');
  if(f){
    var update=function(cat){
      var cards=document.querySelectorAll('#workGrid .work'),n=0;
      Array.prototype.forEach.call(cards,function(c){
        var show=(cat==='all'||c.getAttribute('data-cat')===cat);
        c.style.display=show?'':'none';if(show){n++;c.classList.add('in');}
      });
      $('#workCount').textContent=t('يُعرض الآن '+n+' من أصل '+WORKS.length+' مخرجات، وجميعها مكتملة.','Showing '+n+' of '+WORKS.length+' deliverables — all completed.');
    };
    f.addEventListener('click',function(e){
      var b=e.target.closest('button[data-cat]');if(!b)return;
      Array.prototype.forEach.call(f.querySelectorAll('button'),function(x){x.classList.remove('on');x.setAttribute('aria-pressed','false');});
      b.classList.add('on');b.setAttribute('aria-pressed','true');update(b.getAttribute('data-cat'));
    });
    update('all');
  }
  document.querySelectorAll('[data-lb]').forEach(function(b){
    b.addEventListener('click',function(){
      var i=parseInt(b.getAttribute('data-lb'),10);
      $('#lbIn').innerHTML=slideHTML(i)+'<p class="lbcap">'+t('إعادة تمثيل تخطيطية لموضوع الشريحة، وليست لقطة من الملف الأصلي.','A schematic re-representation of the slide topic, not a screenshot of the original file.')+'</p>';
      $('#lightbox').classList.add('open');$('#lbClose').focus();
    });
  });
}

/* ═════════ الأحداث ═════════ */
function setTheme(v,announce){
  THEME=v;root.setAttribute('data-theme',v);
  try{localStorage.setItem('itp_theme',v);}catch(e){}
  var mc=document.querySelector('meta[name=theme-color]');if(mc)mc.setAttribute('content',v==='light'?'#EDF1F7':'#0B1628');
  buildSettings();buildDrawer();
  if(announce)toast(t('تم تحويل المظهر إلى الوضع '+(v==='light'?'الفاتح':'الغامق')+'.','Theme switched to '+(v==='light'?'light':'dark')+' mode.'));
}
function setLang(v){
  if(LANG===v)return;
  LANG=v;try{localStorage.setItem('itp_lang',v);}catch(e){}
  var y=window.scrollY;render(false);window.scrollTo(0,y);
  toast(v==='ar'?'تم تبديل اللغة إلى العربية.':'Language switched to English.');
}
function closeSet(){$('#setPanel').classList.remove('open');$('#setBtn').classList.remove('on');$('#setBtn').setAttribute('aria-expanded','false');}
function closeDrawer(){$('#drawer').classList.remove('open');$('#scrim').classList.remove('open');$('#burger').setAttribute('aria-expanded','false');document.body.style.overflow='';}
function openDrawer(){$('#drawer').classList.add('open');$('#scrim').classList.add('open');$('#burger').setAttribute('aria-expanded','true');document.body.style.overflow='hidden';}

document.addEventListener('click',function(e){
  var lang=e.target.closest('[data-lang]');
  if(lang){setLang(lang.getAttribute('data-lang'));return;}
  var th=e.target.closest('[data-theme-toggle]');
  if(th){setTheme(THEME==='dark'?'light':'dark',true);return;}
  var act=e.target.closest('[data-act]');
  if(act){
    var a=act.getAttribute('data-act');
    if(a==='top'){window.scrollTo({top:0,behavior:'smooth'});}
    else if(a==='print'){window.print();}
    else if(a==='search'){openSearch();}
    else if(a==='copy'){
      var url=location.href;
      var ok=function(){toast(t('تم نسخ رابط الصفحة.','Page link copied.'));};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(ok,fallback);}else fallback();
      function fallback(){
        var ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
        try{document.execCommand('copy');ok();}catch(err){toast(t('تعذّر النسخ التلقائي، انسخ الرابط من شريط العنوان.','Auto-copy failed; copy the link from the address bar.'));}
        document.body.removeChild(ta);
      }
    }
    return;
  }
  if(e.target.closest('#setBtn')){
    var open=$('#setPanel').classList.toggle('open');
    $('#setBtn').classList.toggle('on',open);$('#setBtn').setAttribute('aria-expanded',open?'true':'false');return;
  }
  if(!e.target.closest('.setwrap'))closeSet();
  if(e.target.closest('#burger')){openDrawer();return;}
  if(e.target.closest('#drawerClose')||e.target.id==='scrim'){closeDrawer();return;}
  if(e.target.closest('#searchBtn')){openSearch();return;}
  if(e.target.closest('#searchClose')||e.target.id==='searchModal'){closeSearch();return;}
  if(e.target.closest('#lbClose')||e.target.id==='lightbox'){$('#lightbox').classList.remove('open');return;}
  var link=e.target.closest('a[href^="#/"]');
  if(link){
    closeDrawer();closeSet();closeSearch();
    Array.prototype.forEach.call(document.querySelectorAll('.has'),function(o){o.classList.remove('open');});
    if(link.getAttribute('href')===location.hash){render();}
    return;
  }
  if(!e.target.closest('.has')){Array.prototype.forEach.call(document.querySelectorAll('.has'),function(o){o.classList.remove('open');var b=o.querySelector('button');if(b)b.setAttribute('aria-expanded','false');});}
});
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();return;}
  if(e.key==='Escape'){closeSet();closeDrawer();closeSearch();$('#lightbox').classList.remove('open');
    Array.prototype.forEach.call(document.querySelectorAll('.has'),function(o){o.classList.remove('open');});return;}
  if($('#searchModal').classList.contains('open')){
    if(e.key==='ArrowDown'){e.preventDefault();moveSel(1);}
    else if(e.key==='ArrowUp'){e.preventDefault();moveSel(-1);}
    else if(e.key==='Enter'){var sel=$('#searchRes').querySelector('a.sel');if(sel){e.preventDefault();location.hash=sel.getAttribute('href');closeSearch();}}
  }
});
document.addEventListener('input',function(e){if(e.target.id==='searchInput')renderSearch(e.target.value);});
window.addEventListener('hashchange',function(){render();});
window.addEventListener('scroll',function(){
  var h=document.documentElement.scrollHeight-window.innerHeight;
  var p=h>0?Math.min(1,window.scrollY/h):0;
  $('#prog').style.transform='scaleX('+p+')';
},{passive:true});
window.addEventListener('resize',function(){if(window.innerWidth>1180)closeDrawer();});

/* ═════════ الإقلاع ═════════ */
if(!location.hash)location.replace('#/home');
setTheme(THEME,false);
render();
})();
</script>
</body>
</html>
