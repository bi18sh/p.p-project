/* ═════════ نظام الألوان مشتق من الشعار والبروشور ═════════ */
:root{
  --bg:#0B1628;--bg2:#101F35;--card:#152943;--card2:#122339;--line:#29445E;--line2:#1E3450;
  --txt:#F5F7FA;--txt2:#A9B8CC;
  --c1:#19BDB4;--c2:#65D1D8;--c3:#2E9BF5;--c4:#6C4BE8;--c5:#A63FD0;--c6:#F4B942;--c7:#3FBF7F;--c8:#E4674F;
  --bA:#29A8F5;--bB:#3B34D6;--bC:#9B2FD0;
  --primary:#19BDB4;--secondary:#65D1D8;--accent:#F4B942;--on-c:#052029;
  --glass:rgba(17,33,56,.9);--scrim:rgba(4,10,20,.84);--soft:rgba(25,189,180,.1);
  --chip:rgba(41,68,94,.42);--hover:rgba(25,189,180,.11);--grid:rgba(41,68,94,.42);
  --sh1:0 14px 34px -18px rgba(0,0,0,.85);--sh2:0 34px 70px -28px rgba(0,0,0,.92);
  --r:18px;--rs:12px;--rl:26px;--pill:999px;
  --ffh:Cairo,'Segoe UI',Tahoma,'Noto Sans Arabic',Arial,sans-serif;
  --ffb:Tajawal,Cairo,'Segoe UI',Tahoma,'Noto Sans Arabic',Arial,sans-serif;
  --ease:cubic-bezier(.22,.85,.3,1);
  --pad:clamp(.85rem,3.6vw,2.4rem);
  --head:clamp(58px,7.4vw,74px);
  --maxw:1290px;--grain:.05;--bar:0px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
html[data-theme=light]{
  --bg:#EDF2F8;--bg2:#F7FAFD;--card:#FFFFFF;--card2:#F2F6FB;--line:#D3DEEA;--line2:#E3EAF3;
  --txt:#0B1628;--txt2:#4E6178;
  --c1:#0C857F;--c2:#0E7490;--c3:#1F73C9;--c4:#4B34C4;--c5:#8A25B0;--c6:#A9710A;--c7:#1F8F58;--c8:#C6462F;
  --bA:#1E86D6;--bB:#2E28B0;--bC:#7C22A8;
  --primary:#0C857F;--secondary:#0E7490;--accent:#A9710A;--on-c:#FFFFFF;
  --glass:rgba(255,255,255,.94);--scrim:rgba(15,26,44,.55);--soft:rgba(12,133,127,.08);
  --chip:rgba(11,22,40,.055);--hover:rgba(12,133,127,.09);--grid:rgba(120,145,175,.22);
  --sh1:0 12px 28px -18px rgba(20,40,70,.35);--sh2:0 30px 60px -26px rgba(20,40,70,.35);--grain:.022;
}
*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0;min-width:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;overflow-x:clip}
body{
  font-family:var(--ffb);font-size:clamp(.97rem,.9rem + .35vw,1.07rem);line-height:1.9;color:var(--txt);
  background:var(--bg);overflow-x:clip;position:relative;min-height:100vh;min-height:100svh;
  padding-bottom:var(--bar);-webkit-tap-highlight-color:transparent;
  background-image:
    radial-gradient(1100px 620px at 100% -10%,color-mix(in srgb,var(--c3) 22%,transparent),transparent 62%),
    radial-gradient(950px 540px at -12% 4%,color-mix(in srgb,var(--c5) 16%,transparent),transparent 60%),
    radial-gradient(900px 520px at 55% 106%,color-mix(in srgb,var(--c1) 14%,transparent),transparent 62%);
  background-attachment:fixed;transition:background-color .4s var(--ease),color .4s var(--ease);
}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:clamp(40px,7vw,66px) clamp(40px,7vw,66px);
  -webkit-mask-image:radial-gradient(1200px 800px at 72% -4%,#000,transparent 76%);mask-image:radial-gradient(1200px 800px at 72% -4%,#000,transparent 76%)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:var(--grain);
  background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
ul,ol{list-style:none}
a{color:var(--secondary);text-decoration:none;transition:color .2s;overflow-wrap:anywhere}
a:hover{color:var(--accent)}
bdi{unicode-bidi:isolate;font-family:var(--ffh)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
img,svg{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
::selection{background:color-mix(in srgb,var(--c3) 42%,transparent);color:var(--txt)}
*{scrollbar-width:thin;scrollbar-color:var(--c3) var(--bg2)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--bg2);border-radius:99px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--bA),var(--bC));border:3px solid var(--bg2);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--c2),var(--c6))}
::-webkit-scrollbar-corner{background:var(--bg2)}

/* ═════════ عام ═════════ */
.wrap{width:min(100% - var(--pad)*2,var(--maxw));margin-inline:auto;position:relative;z-index:1}
.skip{position:fixed;inset-inline-start:1rem;top:-120px;z-index:400;background:var(--accent);color:var(--on-c);font:700 .95rem/1 var(--ffh);padding:.95rem 1.3rem;border-radius:0 0 14px 14px;transition:top .25s}
.skip:focus{top:0}
.sec{padding:clamp(2.2rem,5.4vw,5.2rem) 0;position:relative;z-index:1;scroll-margin-top:calc(var(--head) + 20px)}
.sec--alt{background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--bg2) 88%,transparent) 12%,color-mix(in srgb,var(--bg2) 88%,transparent) 88%,transparent);border-block:1px solid var(--line2)}
h1,h2,h3,h4{font-family:var(--ffh);line-height:1.32;font-weight:700;overflow-wrap:break-word}
h1{font-size:clamp(1.62rem,1.1rem + 3.4vw,3.35rem);font-weight:900;line-height:1.18}
h2{font-size:clamp(1.28rem,1rem + 1.7vw,2.1rem)}
h3{font-size:clamp(1.02rem,.95rem + .5vw,1.26rem)}
h4{font-size:clamp(.95rem,.9rem + .25vw,1.03rem)}
p{color:var(--txt2);overflow-wrap:break-word}
strong{color:var(--txt);font-weight:700}
.eyebrow{display:inline-flex;align-items:center;gap:.5rem;font:700 clamp(.72rem,.68rem + .2vw,.8rem)/1 var(--ffh);color:var(--primary);background:var(--soft);border:1px solid color-mix(in srgb,var(--primary) 34%,transparent);padding:.5rem .9rem;border-radius:var(--pill);margin-bottom:.9rem;max-width:100%}
.head{max-width:76ch;margin-bottom:clamp(1.3rem,2.6vw,2.4rem)}
.head.center{margin-inline:auto;text-align:center}
.head .lead{margin-top:.8rem;font-size:clamp(.95rem,.9rem + .3vw,1.04rem)}
.grad{background:linear-gradient(100deg,var(--bA),var(--c2) 38%,var(--bC));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:220% 100%;animation:hue 11s ease-in-out infinite}
.mt-s{margin-top:.8rem}.mt-m{margin-top:1.4rem}.mt-l{margin-top:2.2rem}
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.rv.in{opacity:1;transform:none}

/* ═════════ الرأس ═════════ */
.progress{position:fixed;top:0;inset-inline:0;height:3px;z-index:130;background:linear-gradient(90deg,var(--bA),var(--c1),var(--bC));transform:scaleX(0);transform-origin:var(--po,right) center;pointer-events:none}
[dir=ltr] .progress{--po:left}
.hdr{position:sticky;top:0;z-index:110;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid var(--line);padding-top:var(--sat)}
.hdr::before{content:"";position:absolute;inset-inline:0;top:var(--sat);height:2px;background:linear-gradient(90deg,transparent,var(--bA),var(--c1),var(--bC),transparent)}
.hdr-in{display:flex;align-items:center;gap:.5rem;min-height:var(--head)}
.brand{display:flex;align-items:center;gap:.6rem;color:var(--txt);flex:none;min-width:0}
.brand:hover{color:var(--txt)}
.mark{width:clamp(34px,8vw,42px);height:clamp(34px,8vw,42px);flex:none;position:relative;display:grid;place-items:center}
.mark svg,.mark img{width:100%;height:100%;object-fit:contain;border-radius:11px}
.mark::after{content:"";position:absolute;inset:-4px;border-radius:15px;border:1px dashed color-mix(in srgb,var(--bA) 34%,transparent);animation:spin 26s linear infinite;pointer-events:none}
.btxt{display:flex;flex-direction:column;line-height:1.22;min-width:0}
.btxt b{font:900 clamp(.76rem,.68rem + .35vw,.95rem)/1.2 var(--ffh);letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btxt small{font-size:clamp(.6rem,.56rem + .18vw,.71rem);color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{margin-inline-start:auto;min-width:0}
.nav>ul{display:flex;align-items:center;gap:.05rem}
.nav>ul>li{position:relative}
.nav>ul>li>a,.nav>ul>li>button{display:flex;align-items:center;gap:.3rem;padding:.6rem .62rem;border-radius:10px;font:700 .86rem/1 var(--ffh);color:var(--txt2);white-space:nowrap;transition:.22s;min-height:42px}
.nav>ul>li>a:hover,.nav>ul>li>button:hover,.nav>ul>li:focus-within>a,.nav>ul>li:focus-within>button{color:var(--txt);background:var(--hover)}
.nav a.cur,.nav button.cur{color:var(--primary);background:var(--soft);box-shadow:inset 0 -2px 0 var(--primary)}
.caret{width:.34rem;height:.34rem;border-inline-end:2px solid currentColor;border-block-end:2px solid currentColor;transform:rotate(45deg);margin-top:-3px;opacity:.6}
.has::after{content:"";position:absolute;inset-inline:0;top:100%;height:.75rem}
.drop{position:absolute;inset-inline-start:0;top:calc(100% + .5rem);min-width:236px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:16px;padding:.4rem;box-shadow:var(--sh2);opacity:0;visibility:hidden;transform:translateY(-10px);transition:.22s var(--ease);z-index:60}
.has:hover>.drop,.has:focus-within>.drop,.has.open>.drop{opacity:1;visibility:visible;transform:none}
.drop a{display:flex;align-items:center;gap:.5rem;padding:.6rem .8rem;border-radius:10px;color:var(--txt2);font-size:.9rem;font-weight:500;min-height:44px}
.drop a::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--bA);opacity:.5;flex:none}
.drop a:hover,.drop a.cur{background:var(--hover);color:var(--txt)}
.acts{display:flex;align-items:center;gap:.35rem;margin-inline-start:.25rem;flex:none}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--chip);color:var(--txt2);transition:.24s var(--ease);flex:none}
.iconbtn:hover{border-color:var(--primary);color:var(--primary);background:var(--soft)}
.iconbtn.on{border-color:var(--primary);color:var(--primary);background:var(--soft)}
.burger{display:none}
/* أزرار الإضاءة الظاهرة دائمًا */
.lightseg{display:flex;gap:.2rem;padding:.22rem;border:1px solid var(--line);border-radius:var(--pill);background:var(--chip);flex:none}
.lightseg button{width:38px;height:38px;border-radius:var(--pill);display:grid;place-items:center;color:var(--txt2);transition:.22s var(--ease)}
.lightseg button:hover{color:var(--txt)}
.lightseg button.on{background:linear-gradient(130deg,var(--bA),var(--bC));color:#fff;box-shadow:0 6px 16px -8px var(--bA)}
html[data-theme=light] .lightseg button.on{background:linear-gradient(130deg,var(--c6),#e0a52a);color:#2a1c02}
.setwrap{position:relative}
.setpanel{position:absolute;inset-inline-end:0;top:calc(100% + .6rem);width:min(340px,calc(100vw - var(--pad)*2));background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:var(--r);padding:1rem;box-shadow:var(--sh2);z-index:120;display:grid;gap:.8rem;opacity:0;visibility:hidden;transform:translateY(-10px) scale(.98);transition:.24s var(--ease)}
.setpanel.open{opacity:1;visibility:visible;transform:none}
.setpanel h4{font-size:.8rem;color:var(--txt2);display:flex;align-items:center;gap:.45rem}
.srow{display:flex;align-items:center;justify-content:space-between;gap:.7rem;padding:.75rem .8rem;background:var(--chip);border:1px solid var(--line);border-radius:14px;flex-wrap:wrap}
.sinfo{display:flex;flex-direction:column;gap:.12rem;min-width:0;flex:1 1 110px}
.sinfo b{font:700 .92rem/1.4 var(--ffh);color:var(--txt)}
.sinfo span{font-size:.75rem;color:var(--txt2)}
.seg{display:flex;gap:.22rem;padding:.22rem;background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid var(--line);border-radius:var(--pill);flex:none}
.seg button{padding:.45rem .7rem;min-height:36px;border-radius:var(--pill);font:700 .8rem/1 var(--ffh);color:var(--txt2);transition:.22s var(--ease);display:flex;align-items:center;gap:.3rem}
.seg button.on{background:linear-gradient(120deg,var(--bA),var(--bC));color:#fff;box-shadow:0 6px 16px -9px var(--bA)}
.seg button .ico{width:1rem;height:1rem}
.setfoot{border-top:1px dashed var(--line);padding-top:.7rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-size:.73rem;color:var(--txt2);flex-wrap:wrap}
.kbd{font:700 .7rem/1 var(--ffh);border:1px solid var(--line);border-radius:6px;padding:.28rem .45rem;background:var(--chip);color:var(--txt2)}

/* ═════════ درج الهاتف + الشريط السفلي ═════════ */
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(4px);z-index:140;opacity:0;visibility:hidden;transition:.3s}
.scrim.open{opacity:1;visibility:visible}
.drawer{position:fixed;inset-block:0;inset-inline-start:0;width:min(340px,88vw);height:100vh;height:100dvh;z-index:150;background:var(--bg2);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;transition:transform .34s var(--ease);box-shadow:var(--sh2);padding-top:var(--sat);padding-bottom:var(--sab)}
[dir=rtl] .drawer{transform:translateX(100%)}
[dir=ltr] .drawer{transform:translateX(-100%)}
.drawer.open{transform:none!important}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.8rem 1rem;border-bottom:1px solid var(--line);min-height:var(--head)}
.dbody{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:.7rem;display:grid;gap:.3rem;align-content:start}
.dbody>a,.dgrp>summary{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.8rem .95rem;border-radius:12px;color:var(--txt);font:700 .93rem/1.5 var(--ffh);min-height:50px;border:1px solid transparent}
.dbody>a:hover,.dgrp>summary:hover{background:var(--hover);color:var(--primary)}
.dbody>a.cur{background:var(--soft);border-color:color-mix(in srgb,var(--primary) 45%,transparent);color:var(--primary)}
.dgrp{border:1px solid var(--line);border-radius:12px;background:var(--chip)}
.dgrp>summary{list-style:none;cursor:pointer;color:var(--secondary)}
.dgrp>summary::-webkit-details-marker{display:none}
.dgrp>summary::after{content:"+";font-size:1.2rem;color:var(--primary)}
.dgrp[open]>summary::after{content:"−"}
.dgrp>div{display:grid;padding:.1rem .5rem .6rem}
.dgrp>div a{display:flex;align-items:center;gap:.5rem;padding:.7rem .8rem;border-radius:10px;color:var(--txt2);font-size:.9rem;min-height:46px}
.dgrp>div a::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--bA);opacity:.55;flex:none}
.dgrp>div a:hover,.dgrp>div a.cur{background:var(--hover);color:var(--txt)}
.dfoot{padding:.8rem 1rem;border-top:1px solid var(--line);display:grid;gap:.55rem}
.tabbar{display:none;position:fixed;inset-inline:0;bottom:0;z-index:105;background:color-mix(in srgb,var(--bg2) 94%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:.35rem max(.35rem,var(--sal)) calc(.35rem + var(--sab)) max(.35rem,var(--sar));grid-template-columns:repeat(5,1fr);gap:.15rem}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.18rem;padding:.4rem .1rem;border-radius:12px;color:var(--txt2);font:700 .64rem/1.2 var(--ffh);min-height:52px;text-align:center}
.tabbar a.cur{color:var(--primary);background:var(--soft)}
.tabbar .ico{width:1.28rem;height:1.28rem}
.tabbar button:active,.tabbar a:active{transform:scale(.94)}

/* ═════════ النوافذ ═════════ */
.modal{position:fixed;inset:0;z-index:200;display:none;place-items:start center;padding:clamp(.8rem,7vh,5rem) var(--pad) 2rem;background:var(--scrim);backdrop-filter:blur(8px);overflow-y:auto}
.modal.open{display:grid;animation:fade .25s var(--ease) both}
.mbox{width:min(660px,100%);background:var(--bg2);border:1px solid var(--line);border-radius:var(--rl);box-shadow:var(--sh2);overflow:hidden;animation:pop .3s var(--ease) both}
.mtop{display:flex;align-items:center;gap:.6rem;padding:.8rem 1rem;border-bottom:1px solid var(--line)}
.mtop input{flex:1;background:none;border:none;outline:none;color:var(--txt);font:500 1rem/1.6 var(--ffb);min-width:0}
.mres{max-height:min(52vh,430px);overflow-y:auto;padding:.5rem}
.mres a{display:flex;align-items:center;gap:.75rem;padding:.7rem .85rem;border-radius:12px;color:var(--txt2);border:1px solid transparent;min-height:52px}
.mres a .ico{color:var(--primary)}
.mres a b{display:block;font:700 .93rem/1.4 var(--ffh);color:var(--txt)}
.mres a small{font-size:.76rem}
.mres a:hover,.mres a.sel{background:var(--hover);border-color:color-mix(in srgb,var(--primary) 35%,transparent)}
.mempty{padding:1.5rem;text-align:center;color:var(--txt2);font-size:.9rem}
.mfoot{border-top:1px solid var(--line);padding:.6rem 1rem;display:flex;gap:.7rem;flex-wrap:wrap;font-size:.73rem;color:var(--txt2)}
.lb{position:fixed;inset:0;z-index:210;display:none;place-items:center;background:var(--scrim);backdrop-filter:blur(8px);padding:calc(var(--sat) + 3.6rem) var(--pad) calc(var(--sab) + 1rem);overflow:auto}
.lb.open{display:grid;animation:fade .25s var(--ease) both}
.lbin{width:min(900px,100%);display:grid;gap:.85rem;animation:pop .3s var(--ease) both;margin:auto}
.lbclose{position:fixed;inset-inline-end:calc(var(--pad) + var(--sar));top:calc(var(--sat) + .7rem);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--txt);z-index:2}
.lbclose:hover{border-color:var(--c8);color:var(--c8)}
.lbcap{color:var(--txt2);font-size:.86rem;text-align:center}

/* ═════════ الأزرار والبطاقات ═════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.78rem 1.3rem;min-height:48px;border-radius:var(--pill);font:700 .91rem/1.2 var(--ffh);border:1px solid transparent;transition:.26s var(--ease);text-align:center}
.btn--p{background:linear-gradient(120deg,var(--bA),var(--bB) 55%,var(--bC));color:#fff;box-shadow:0 14px 32px -18px var(--bA)}
.btn--p:hover{color:#fff;transform:translateY(-3px)}
.btn--t{background:linear-gradient(120deg,var(--c1),color-mix(in srgb,var(--c1) 55%,var(--c3)));color:var(--on-c);box-shadow:0 14px 32px -18px var(--c1)}
.btn--t:hover{color:var(--on-c);transform:translateY(-3px)}
.btn--g{background:linear-gradient(120deg,var(--c6),color-mix(in srgb,var(--c6) 70%,var(--c8)));color:var(--on-c)}
.btn--g:hover{color:var(--on-c);transform:translateY(-3px)}
.btn--o{background:var(--chip);border-color:var(--line);color:var(--txt)}
.btn--o:hover{border-color:var(--primary);color:var(--primary);background:var(--soft);transform:translateY(-3px)}
.btn--sm{padding:.55rem 1rem;min-height:44px;font-size:.83rem}
.row{display:flex;flex-wrap:wrap;gap:.65rem;margin-top:1.4rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.4rem .8rem;border-radius:var(--pill);background:var(--chip);border:1px solid var(--line);color:var(--txt2);font-size:.8rem;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.done{display:inline-flex;align-items:center;gap:.32rem;padding:.3rem .75rem;border-radius:var(--pill);background:color-mix(in srgb,var(--c7) 15%,transparent);border:1px solid color-mix(in srgb,var(--c7) 45%,transparent);color:var(--c7);font:700 .76rem/1.4 var(--ffh);flex:none}
.done .ico{width:1rem;height:1rem}
.grid{display:grid;gap:clamp(.75rem,1.6vw,1.15rem)}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,275px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,215px),1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.card{--c:var(--c1);position:relative;background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--r);padding:clamp(1rem,2vw,1.45rem);box-shadow:var(--sh1);transition:transform .3s var(--ease),border-color .3s,box-shadow .3s;overflow:hidden;display:flex;flex-direction:column}
.card::before{content:"";position:absolute;inset-inline:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--c),transparent);opacity:0;transition:.3s}
.card:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--c) 55%,var(--line));box-shadow:var(--sh2)}
.card:hover::before{opacity:1}
.card h3{margin-bottom:.5rem}
.card p{font-size:.92rem}
.card .btn{margin-top:auto;align-self:flex-start}
.card p+.btn{margin-top:1rem}
.cico{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;margin-bottom:.85rem;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 36%,transparent);flex:none}
.cnum{position:absolute;inset-inline-end:.9rem;top:.4rem;font:900 2.4rem/1 var(--ffh);color:color-mix(in srgb,var(--txt2) 13%,transparent)}
.panel{background:linear-gradient(150deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--rl);padding:clamp(1rem,2.4vw,2rem);box-shadow:var(--sh1)}
.panel--t{--c:var(--c1);border-color:color-mix(in srgb,var(--c) 36%,var(--line));background:linear-gradient(150deg,color-mix(in srgb,var(--c) 9%,var(--card)),var(--card2))}
.note{border-inline-start:3px solid var(--c6);background:color-mix(in srgb,var(--c6) 8%,transparent);padding:.85rem 1.05rem;border-radius:0 var(--rs) var(--rs) 0;color:var(--txt2);font-size:.88rem}
.note--i{border-color:var(--c3);background:color-mix(in srgb,var(--c3) 8%,transparent)}
.ticks{display:grid;gap:.45rem;margin-top:.8rem}
.ticks li{position:relative;padding-inline-start:1.45rem;color:var(--txt2);font-size:.91rem;line-height:1.8}
.ticks li::before{content:"";position:absolute;inset-inline-start:0;top:.62em;width:9px;height:9px;border-radius:3px;background:var(--c,var(--c1));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--c1)) 16%,transparent)}
.dots li{position:relative;padding-inline-start:1.2rem;color:var(--txt2);font-size:.91rem;line-height:1.8}
.dots li::before{content:"";position:absolute;inset-inline-start:.12rem;top:.78em;width:6px;height:6px;border-radius:50%;background:var(--secondary)}
.stat{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--r);padding:1.2rem .9rem;text-align:center;position:relative;overflow:hidden;transition:.3s var(--ease)}
.stat::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:linear-gradient(90deg,var(--bA),var(--c1),var(--bC));transform:scaleX(0);transition:transform .4s var(--ease)}
.stat:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--c3) 50%,var(--line))}
.stat:hover::after{transform:scaleX(1)}
.stat .ico{color:var(--secondary);margin-bottom:.4rem}
.stat b{display:block;font:900 clamp(1.75rem,1.3rem + 2vw,2.7rem)/1 var(--ffh);background:linear-gradient(160deg,var(--bA),var(--bC));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{display:block;margin-top:.4rem;font-size:.84rem;color:var(--txt2)}

/* ═════════ الواجهة ═════════ */
.hero{position:relative;padding:clamp(1.8rem,5vw,4.6rem) 0 clamp(1.8rem,4vw,3.4rem);overflow:hidden}
.herogrid{display:grid;grid-template-columns:1.08fr .92fr;gap:clamp(1.4rem,3.4vw,3rem);align-items:center}
.kicker{display:inline-flex;align-items:center;gap:.55rem;font:900 clamp(.72rem,.66rem + .3vw,.88rem)/1 var(--ffh);letter-spacing:.06em;color:var(--secondary);border:1px solid color-mix(in srgb,var(--c3) 40%,transparent);background:color-mix(in srgb,var(--c3) 10%,transparent);padding:.5rem .95rem;border-radius:var(--pill);max-width:100%}
.hero h1{margin:.9rem 0 .5rem}
.slogan{font:700 clamp(.98rem,.9rem + .6vw,1.28rem)/1.55 var(--ffh);color:var(--accent);margin-bottom:.8rem}
.intro{max-width:62ch;font-size:clamp(.94rem,.9rem + .25vw,1.02rem)}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.42;pointer-events:none;z-index:0}
.o1{width:min(330px,60vw);height:min(330px,60vw);background:var(--bA);inset-inline-end:-60px;top:-70px;animation:drift 18s ease-in-out infinite}
.o2{width:min(270px,52vw);height:min(270px,52vw);background:var(--bC);inset-inline-start:-70px;bottom:-60px;animation:drift 23s ease-in-out infinite reverse}
.o3{width:min(190px,40vw);height:min(190px,40vw);background:var(--c1);inset-inline-start:44%;top:36%;animation:drift 27s ease-in-out infinite}
/* إطار البروشور */
.posterframe{position:relative;display:grid;place-items:center;perspective:1200px}
.poster{width:min(100%,400px);border-radius:20px;overflow:hidden;border:1px solid color-mix(in srgb,var(--c3) 40%,var(--line));box-shadow:0 40px 80px -34px rgba(0,0,0,.9),0 0 0 1px color-mix(in srgb,var(--bA) 18%,transparent);background:#04102a;transition:transform .5s var(--ease)}
.poster img,.poster svg{width:100%;height:auto;display:block}
.posterframe .poster{transform:rotateY(var(--ry,-7deg)) rotateX(3deg);animation:bob 9s ease-in-out infinite}
[dir=ltr] .posterframe .poster{--ry:7deg}
.posterframe:hover .poster{transform:rotateY(0) rotateX(0) scale(1.02)}
.posterbadge{position:absolute;inset-inline-start:-6px;top:-14px;display:flex;align-items:center;gap:.45rem;background:var(--glass);border:1px solid var(--line);border-radius:var(--pill);padding:.4rem .8rem;font:700 .74rem/1 var(--ffh);color:var(--txt);box-shadow:var(--sh1);backdrop-filter:blur(10px)}
.posterbadge .mark{width:22px;height:22px}
.posterbadge .mark::after{display:none}
.posteract{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin-top:1rem}
.logolock{display:flex;align-items:center;gap:clamp(.7rem,2vw,1.1rem)}
.logolock .bigmark{width:clamp(64px,15vw,110px);height:clamp(64px,15vw,110px);flex:none}
.logolock .bigmark svg,.logolock .bigmark img{width:100%;height:100%;object-fit:contain}
.wordmark{font:900 clamp(1.1rem,.9rem + 1.4vw,2rem)/1.1 var(--ffh);letter-spacing:-.02em;color:var(--txt)}
.wordmark small{display:block;font:500 clamp(.7rem,.66rem + .2vw,.82rem)/1.5 var(--ffb);color:var(--txt2);letter-spacing:0}

/* ═════════ رأس الصفحات ═════════ */
.phero{position:relative;padding:clamp(1.6rem,4vw,3.2rem) 0 clamp(1.2rem,2.6vw,2.2rem);border-bottom:1px solid var(--line);overflow:hidden;--c:var(--c1)}
.phero::before{content:"";position:absolute;inset-inline-end:-10%;top:-70%;width:min(520px,90vw);height:min(520px,90vw);border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 26%,transparent),transparent 66%);filter:blur(28px);pointer-events:none}
.crumbs{margin-bottom:.9rem}
.crumbs ol{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem;font-size:.81rem;color:var(--txt2)}
.crumbs li+li::before{content:"‹";margin-inline-end:.35rem;color:var(--line)}
[dir=ltr] .crumbs li+li::before{content:"›"}
.crumbs a{color:var(--txt2)}
.crumbs a:hover{color:var(--primary)}
.crumbs [aria-current]{color:var(--c);font-weight:700}
.phero h1{font-size:clamp(1.5rem,1.1rem + 2.6vw,2.85rem)}
.phero .lead{max-width:78ch;margin-top:.8rem;font-size:clamp(.94rem,.9rem + .25vw,1.02rem)}
.pmeta{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.1rem;align-items:center}
.ptools{display:flex;gap:.4rem;margin-inline-start:auto}

/* ═════════ الفريق ═════════ */
.member{--c:var(--c1);background:linear-gradient(165deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--rl);padding:clamp(1rem,2vw,1.45rem);position:relative;overflow:hidden;transition:.32s var(--ease)}
.member::after{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%);pointer-events:none}
.member:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--c) 55%,var(--line));box-shadow:var(--sh2)}
.mhead{display:flex;align-items:center;gap:.8rem;margin-bottom:.8rem;flex-wrap:wrap}
.av{width:clamp(50px,12vw,62px);height:clamp(50px,12vw,62px);flex:none;border-radius:19px;display:grid;place-items:center;font:900 clamp(1rem,.9rem + .5vw,1.2rem)/1 var(--ffh);color:#fff;background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 50%,var(--bC)));box-shadow:0 12px 26px -14px var(--c)}
.mname{font:900 clamp(1.05rem,.98rem + .4vw,1.2rem)/1.3 var(--ffh)}
.midx{font:700 .72rem/1 var(--ffh);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 42%,transparent);padding:.26rem .55rem;border-radius:var(--pill);display:inline-block;margin-bottom:.32rem}
.mrole{font-weight:700;color:var(--txt);font-size:.95rem;margin-bottom:.2rem}
.mroleEn{font-size:.8rem;color:var(--txt2);font-family:var(--ffh);margin-bottom:.7rem}
.member details{margin-top:.8rem;border-top:1px dashed var(--line);padding-top:.7rem}
.member summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:.6rem;font:700 .89rem/1.5 var(--ffh);color:var(--c);padding:.55rem .3rem;border-radius:9px;min-height:46px}
.member summary::-webkit-details-marker{display:none}
.member summary::after{content:"+";font-size:1.3rem;line-height:1}
.member details[open] summary::after{content:"−"}
.member summary:hover{background:var(--hover)}
.subh{font:700 .88rem/1.5 var(--ffh);color:var(--secondary);margin:.9rem 0 .35rem}

/* ═════════ المخططات ═════════ */
.dg{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--rl);padding:clamp(.9rem,2.2vw,1.8rem);box-shadow:var(--sh1);position:relative;overflow:hidden}
.dgt{display:flex;align-items:center;gap:.5rem;font:700 clamp(.86rem,.82rem + .2vw,.97rem)/1.5 var(--ffh);color:var(--secondary);margin-bottom:1rem}
.dgn{margin-top:.9rem;font-size:.83rem;color:var(--txt2);border-top:1px dashed var(--line);padding-top:.8rem}
.dscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:.5rem}
.orgtop{display:flex;justify-content:center}
.node{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--r);padding:.9rem;text-align:center;position:relative;transition:.3s var(--ease)}
.node:hover{border-color:var(--primary);transform:translateY(-4px)}
.node b{display:block;font:900 .98rem/1.4 var(--ffh)}
.node span{display:block;font-size:.78rem;color:var(--txt2);margin-top:.28rem;line-height:1.6}
.lead-node{min-width:min(100%,330px);border-color:color-mix(in srgb,var(--c6) 55%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--c6) 13%,var(--card)),var(--card2))}
.lead-node b{color:var(--accent)}
.stem{width:2px;height:30px;margin-inline:auto;background:linear-gradient(180deg,var(--c6),var(--line))}
.orgrow{display:grid;grid-template-columns:repeat(5,1fr);gap:.8rem;position:relative;padding-top:30px}
.orgrow::before{content:"";position:absolute;top:0;inset-inline:10%;height:2px;background:linear-gradient(90deg,var(--line),var(--c3),var(--line))}
.orgrow .node::before{content:"";position:absolute;top:-30px;inset-inline-start:50%;width:2px;height:30px;background:var(--line)}
.orgrow .node::after{content:"";position:absolute;top:-5px;inset-inline-start:calc(50% - 4px);width:8px;height:8px;border-radius:50%;background:var(--c3)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,172px),1fr));gap:1.5rem}
.fstep{--c:var(--c1);position:relative;background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--r);padding:1.05rem 1rem;transition:.3s var(--ease)}
.fstep:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.fstep::after{content:"←";position:absolute;inset-inline-start:-1.25rem;top:50%;transform:translateY(-50%);color:var(--c3);font-size:1.15rem;font-weight:700}
[dir=ltr] .fstep::after{content:"→"}
.fstep:last-child::after{display:none}
.fn{display:grid;place-items:center;width:32px;height:32px;border-radius:11px;font:900 .9rem/1 var(--ffh);color:#fff;background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 50%,var(--bC)));margin-bottom:.6rem}
.fstep b{display:block;font:700 .94rem/1.5 var(--ffh);margin-bottom:.28rem}
.fstep p{font-size:.85rem;line-height:1.7}
.fwho{display:inline-block;margin-top:.5rem;font-size:.75rem;color:var(--accent);font-family:var(--ffh);font-weight:700}
.gantt{min-width:640px}
.ghead,.grow{display:grid;grid-template-columns:minmax(150px,205px) 1fr;gap:.7rem;align-items:center}
.ghead{margin-bottom:.5rem}
.ghead span{font:700 .73rem/1.35 var(--ffh);color:var(--txt2);text-align:center;padding:.35rem .18rem;border-radius:8px;background:var(--chip)}
.ghead>span:first-child{text-align:start;background:none;color:var(--secondary)}
.grow{padding:.24rem 0}
.gname{font:500 .85rem/1.5 var(--ffb);color:var(--txt)}
.gtrack{display:grid;grid-template-columns:1.15fr 1.15fr 1.15fr 1.15fr .72fr;grid-template-rows:34px;align-items:center}
.gcell{grid-row:1;height:100%;border-inline-start:1px dashed var(--line);background:var(--chip)}
.gcell:nth-child(1){grid-column:1}.gcell:nth-child(2){grid-column:2}.gcell:nth-child(3){grid-column:3}.gcell:nth-child(4){grid-column:4}.gcell:nth-child(5){grid-column:5;border-inline-end:1px dashed var(--line)}
.gbar{grid-row:1;z-index:1;height:25px;margin-inline:3px;border-radius:8px;display:flex;align-items:center;padding-inline:.5rem;font:700 .7rem/1 var(--ffh);color:var(--on-c);white-space:nowrap;overflow:hidden;background:linear-gradient(120deg,var(--c),color-mix(in srgb,var(--c) 60%,#fff));transition:.3s var(--ease)}
.gbar:hover{transform:scaleY(1.16)}
.gbar.st{background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.18) 0 5px,transparent 5px 10px),linear-gradient(120deg,var(--c),color-mix(in srgb,var(--c) 60%,#fff))}
.gleg{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.85rem;font-size:.77rem;color:var(--txt2)}
.gleg i{display:inline-block;width:13px;height:10px;border-radius:3px;margin-inline-end:.3rem;vertical-align:middle}
.ptime{display:flex;gap:4px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.pseg{flex-grow:var(--d);flex-basis:0;min-width:0;padding:.8rem .5rem;background:linear-gradient(165deg,color-mix(in srgb,var(--c) 30%,var(--card)),var(--card2));border-top:4px solid var(--c);text-align:center;transition:.3s}
.pseg b{display:block;font:900 1.05rem/1 var(--ffh);color:var(--c)}
.pseg small{display:block;font-size:.68rem;color:var(--txt2);margin-top:.28rem;font-family:var(--ffh)}
.pleg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,235px),1fr));gap:.7rem;margin-top:1rem}
.pitem{display:flex;gap:.7rem;align-items:flex-start;background:var(--chip);border:1px solid var(--line);border-inline-start:4px solid var(--c);border-radius:var(--rs);padding:.75rem .9rem}
.pitem b{font:700 .88rem/1.5 var(--ffh);display:block}
.pitem span{font-size:.77rem;color:var(--txt2);font-family:var(--ffh)}
.net{position:relative;aspect-ratio:16/9;min-height:300px}
.netlinks{position:absolute;inset:0;width:100%;height:100%}
.netlinks line{stroke:var(--line);stroke-width:2;stroke-dasharray:7 7;animation:dash 2.8s linear infinite}
.netlinks line.hot{stroke:color-mix(in srgb,var(--c) 70%,transparent)}
.nnode{--c:var(--c1);position:absolute;transform:translate(-50%,-50%);background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:14px;padding:.6rem .8rem;text-align:center;min-width:112px;box-shadow:var(--sh1);transition:.3s var(--ease)}
.nnode:hover{border-color:var(--c);transform:translate(-50%,-50%) scale(1.06);z-index:3}
.nnode b{display:block;font:700 .83rem/1.4 var(--ffh)}
.nnode small{font-size:.7rem;color:var(--txt2)}
.nnode .ico{color:var(--c);margin-bottom:.18rem}
.nhub{border-color:color-mix(in srgb,var(--c) 60%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--c) 20%,var(--card)),var(--card2));min-width:142px}
.nhub b{color:var(--c)}
.fish{display:grid}
.bones{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;padding-inline-end:clamp(1rem,10%,120px)}
.bone{--c:var(--c1);background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-top:3px solid var(--c);border-radius:var(--r);padding:.9rem 1rem;position:relative}
.bone h4{color:var(--c);display:flex;align-items:center;gap:.4rem;margin-bottom:.4rem}
.bone li{font-size:.83rem;color:var(--txt2);padding-inline-start:.9rem;position:relative}
.bone li::before{content:"";position:absolute;inset-inline-start:0;top:.75em;width:5px;height:5px;border-radius:50%;background:var(--c)}
.bones.top .bone::after{content:"";position:absolute;bottom:-30px;inset-inline-start:32%;width:2px;height:34px;background:linear-gradient(180deg,var(--c),var(--line));transform:rotate(26deg);transform-origin:top center}
.bones.bot .bone::before{content:"";position:absolute;top:-30px;inset-inline-start:32%;width:2px;height:34px;background:linear-gradient(0deg,var(--c),var(--line));transform:rotate(-26deg);transform-origin:bottom center}
.spine{position:relative;height:8px;margin:30px 0;border-radius:99px}
[dir=rtl] .spine{background:linear-gradient(to left,var(--c8),var(--c6) 30%,var(--c1) 70%,var(--line))}
[dir=ltr] .spine{background:linear-gradient(to right,var(--c8),var(--c6) 30%,var(--c1) 70%,var(--line))}
.spine::before{content:"";position:absolute;inset-inline-start:-2px;top:50%;transform:translateY(-50%);width:0;height:0;border-block:12px solid transparent;border-inline-start:18px solid var(--c8)}
.fprob{position:absolute;inset-inline-start:-4px;top:50%;transform:translate(var(--fx,-100%),-50%);background:linear-gradient(140deg,color-mix(in srgb,var(--c8) 22%,var(--card)),var(--card2));border:1px solid color-mix(in srgb,var(--c8) 60%,transparent);color:var(--c8);border-radius:14px;padding:.6rem .9rem;font:700 .84rem/1.5 var(--ffh);width:max-content;max-width:180px;text-align:center}
[dir=ltr] .fprob{--fx:100%}
.maslow{display:grid;gap:6px;justify-items:center}
.mlvl{width:var(--w);min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:.9rem 1.4rem .7rem;color:var(--on-c);background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 60%,#fff));clip-path:polygon(var(--t) 0,calc(100% - var(--t)) 0,100% 100%,0 100%);transition:.3s var(--ease)}
.mlvl:hover{filter:brightness(1.1);transform:scale(1.02)}
.mlvl b{font:900 .93rem/1.4 var(--ffh)}
.mlvl small{font-size:.72rem;opacity:.92;font-family:var(--ffh);font-weight:700}
.herz{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
.hcol{--c:var(--c1);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:var(--rl);padding:1.3rem;background:linear-gradient(165deg,color-mix(in srgb,var(--c) 11%,var(--card)),var(--card2))}
.hcol h3{color:var(--c);display:flex;align-items:center;gap:.4rem;margin-bottom:.3rem;flex-wrap:wrap}
.hcol>p{font-size:.87rem;margin-bottom:.85rem}
.tuck{display:grid;grid-template-columns:repeat(5,1fr);gap:.9rem;align-items:end}
.tstep{--c:var(--c1);background:linear-gradient(165deg,var(--card),var(--card2));border:1px solid var(--line);border-bottom:4px solid var(--c);border-radius:var(--r);padding:1rem;min-height:calc(132px + var(--i) * 20px);transition:.3s var(--ease)}
.tstep:hover{transform:translateY(-6px);border-color:var(--c)}
.tstep .n{font:900 1.5rem/1 var(--ffh);color:var(--c);opacity:.65}
.tstep b{display:block;font:700 .94rem/1.4 var(--ffh);margin:.3rem 0 .12rem}
.tstep .en{font-size:.74rem;color:var(--c);font-family:var(--ffh);font-weight:700;display:block;margin-bottom:.4rem}
.tstep p{font-size:.82rem;line-height:1.7}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:1.1rem;align-items:center}
.vsb{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:900 .84rem/1 var(--ffh);color:var(--accent);border:1px solid color-mix(in srgb,var(--c6) 50%,transparent);background:color-mix(in srgb,var(--c6) 10%,transparent)}

/* ═════════ الجداول ═════════ */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r);background:var(--card2);box-shadow:var(--sh1)}
table{width:100%;border-collapse:collapse;min-width:520px;font-size:.9rem}
caption{text-align:start;padding:.9rem 1rem;color:var(--txt2);font-size:.85rem;border-bottom:1px solid var(--line)}
thead th{background:linear-gradient(180deg,color-mix(in srgb,var(--c3) 18%,transparent),color-mix(in srgb,var(--c3) 6%,transparent));color:var(--txt);font:700 .88rem/1.5 var(--ffh);padding:.85rem 1rem;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:.8rem 1rem;border-bottom:1px solid var(--line2);color:var(--txt2);vertical-align:top}
tbody th{padding:.8rem 1rem;text-align:start;color:var(--txt);font:700 .9rem/1.6 var(--ffh);border-bottom:1px solid var(--line2);background:var(--chip)}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
tbody tr:hover{background:var(--hover)}
.tnum{font-family:var(--ffh);font-weight:700;color:var(--secondary);white-space:nowrap}

/* ═════════ المعرض والأصول ═════════ */
.filters{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.3rem}
.filters button{padding:.55rem 1rem;border-radius:var(--pill);border:1px solid var(--line);background:var(--chip);color:var(--txt2);font:700 .84rem/1.4 var(--ffh);min-height:44px;transition:.24s var(--ease)}
.filters button:hover{border-color:var(--primary);color:var(--txt)}
.filters button.on{background:linear-gradient(120deg,var(--bA),var(--bC));color:#fff;border-color:transparent}
.work{display:flex;flex-direction:column;gap:.6rem}
.wtop{display:flex;align-items:flex-start;justify-content:space-between;gap:.6rem}
.wmeta{display:grid;gap:.28rem;font-size:.81rem;color:var(--txt2);border-top:1px dashed var(--line);padding-top:.6rem;margin-top:auto}
.wmeta b{color:var(--txt)}
.slide{aspect-ratio:16/9;background:linear-gradient(150deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:clamp(.7rem,1.5vw,1.1rem);display:flex;flex-direction:column;gap:.4rem;position:relative;overflow:hidden}
.slide::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;opacity:.7}
.slide>*{position:relative}
.stag{font:700 .62rem/1 var(--ffh);color:var(--accent)}
.slide h4{font-size:clamp(.78rem,1.3vw,.96rem);line-height:1.4}
.srule{height:2px;width:44%;background:linear-gradient(90deg,var(--bA),transparent);border-radius:2px}
.slines{display:grid;gap:.28rem;margin-top:auto}
.slines i{display:block;height:5px;border-radius:3px;background:color-mix(in srgb,var(--txt2) 26%,transparent)}
.slines i:nth-child(1){width:92%}.slines i:nth-child(2){width:74%}.slines i:nth-child(3){width:83%}
.sbars{display:flex;align-items:flex-end;gap:5px;height:32px;margin-top:auto}
.sbars i{flex:1;border-radius:3px 3px 0 0;background:linear-gradient(180deg,var(--bA),color-mix(in srgb,var(--bC) 35%,transparent))}
.gallery{display:flex;gap:1rem;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:.3rem .2rem 1rem;scroll-snap-type:x mandatory}
.gallery>figure{flex:0 0 min(320px,80vw);scroll-snap-align:start;display:grid;gap:.5rem}
.gallery figcaption{font-size:.82rem;color:var(--txt2);display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.assetgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:1.1rem;align-items:start}
.assetbox{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--rl);padding:clamp(1rem,2vw,1.4rem);display:grid;gap:.9rem}
.logoStage{display:grid;place-items:center;padding:clamp(1rem,3vw,2rem);border-radius:var(--r);border:1px dashed var(--line);background:repeating-conic-gradient(color-mix(in srgb,var(--txt2) 7%,transparent) 0% 25%,transparent 0% 50%) 50%/18px 18px}
.logoStage.onLight{background:#fff}
.logoStage.onDark{background:#0B1628}
.logoStage svg,.logoStage img{width:min(100%,240px);height:auto}
.uploadrow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:200px}
.assetnote{font-size:.8rem;color:var(--txt2)}
.badgeOrig{display:inline-flex;align-items:center;gap:.3rem;font:700 .72rem/1 var(--ffh);color:var(--c7);border:1px solid color-mix(in srgb,var(--c7) 45%,transparent);background:color-mix(in srgb,var(--c7) 12%,transparent);padding:.32rem .6rem;border-radius:var(--pill)}

/* ═════════ الأسئلة ═════════ */
.faq{display:grid;gap:.8rem}
.faq details{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:border-color .3s}
.faq details[open]{border-color:color-mix(in srgb,var(--c3) 50%,var(--line))}
.faq summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:.8rem;padding:1rem 1.1rem;font:700 .95rem/1.6 var(--ffh);min-height:56px}
.faq summary::-webkit-details-marker{display:none}
.faq summary:hover{background:var(--hover);color:var(--secondary)}
.faq .q{flex:none;width:29px;height:29px;border-radius:9px;display:grid;place-items:center;background:var(--soft);border:1px solid color-mix(in srgb,var(--primary) 40%,transparent);color:var(--primary);font:900 .78rem/1 var(--ffh)}
.faq summary::after{content:"+";margin-inline-start:auto;font-size:1.3rem;color:var(--primary);line-height:1}
.faq details[open] summary::after{content:"−"}
.faq .a{padding:.9rem 0 1.15rem;margin-inline:1.1rem;color:var(--txt2);border-top:1px dashed var(--line)}

/* ═════════ التذييل ═════════ */
.ftr{position:relative;z-index:1;margin-top:clamp(1.8rem,4vw,3.6rem);background:linear-gradient(180deg,color-mix(in srgb,var(--bg2) 70%,transparent),var(--bg2));border-top:1px solid var(--line);padding-top:clamp(1.8rem,3.4vw,3rem)}
.ftr::before{content:"";position:absolute;inset-inline:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--bA),var(--c1),var(--bC),transparent)}
.fgrid{display:grid;grid-template-columns:1.5fr repeat(3,1fr) 1.4fr;gap:1.7rem;padding-bottom:2rem}
.fcol h3{font-size:.94rem;margin-bottom:.85rem;position:relative;padding-bottom:.5rem}
.fcol h3::after{content:"";position:absolute;inset-inline-start:0;bottom:0;width:30px;height:2px;background:linear-gradient(90deg,var(--bA),var(--bC));border-radius:2px}
.fcol li{margin-bottom:.45rem}
.fcol a{color:var(--txt2);font-size:.87rem;display:inline-flex;align-items:center;gap:.4rem;min-height:32px}
.fcol a::before{content:"‹";color:var(--line)}
[dir=ltr] .fcol a::before{content:"›"}
.fcol a:hover{color:var(--primary)}
.fbrand p{font-size:.86rem;margin-top:.7rem;max-width:34ch}
.ffacts li{font-size:.83rem;color:var(--txt2);display:flex;gap:.5rem;align-items:flex-start;line-height:1.7}
.ffacts .ico{width:1rem;height:1rem;color:var(--primary);margin-top:.35rem}
.fbot{border-top:1px solid var(--line);padding:1.1rem 0 calc(1.6rem + var(--sab));display:flex;flex-wrap:wrap;gap:.9rem;align-items:center;justify-content:space-between}
.fbot p{font-size:.82rem;max-width:70ch}
.totop{display:inline-flex;align-items:center;gap:.45rem;padding:.6rem 1.05rem;border-radius:var(--pill);border:1px solid var(--line);color:var(--txt2);font:700 .82rem/1 var(--ffh);min-height:44px}
.totop:hover{border-color:var(--primary);color:var(--primary);background:var(--soft)}

/* ═════════ التنبيهات ═════════ */
.toasts{position:fixed;inset-block-end:calc(1rem + var(--bar) + var(--sab));inset-inline-end:calc(1rem + var(--sar));z-index:300;display:grid;gap:.5rem;pointer-events:none}
.toast{display:flex;align-items:center;gap:.55rem;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-inline-start:3px solid var(--c7);border-radius:14px;padding:.75rem 1rem;box-shadow:var(--sh2);font:600 .86rem/1.5 var(--ffb);color:var(--txt);animation:slidein .3s var(--ease) both;max-width:min(340px,86vw)}
.toast .ico{color:var(--c7)}
.toast.out{animation:slideout .3s var(--ease) both}

/* ═════════ الحركات ═════════ */
@keyframes hue{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(24px,-20px) scale(1.08)}66%{transform:translate(-18px,16px) scale(.95)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dash{to{stroke-dashoffset:-28}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slideout{to{opacity:0;transform:translateY(10px)}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -12px}}
.anim{animation:pop .6s var(--ease) both;animation-delay:calc(var(--i,0) * 80ms)}

/* ═════════ الاستجابة الذاتية لكل مقاس هاتف ═════════ */
@media (min-width:1600px){:root{--maxw:1400px}}
@media (max-width:1180px){
  .nav{display:none}.burger{display:grid}.acts{margin-inline-start:auto}
  .herogrid{grid-template-columns:1fr}
  .posterframe{order:-1;max-width:min(420px,86vw);margin-inline:auto;width:100%}
  .posterframe .poster{transform:none;animation:none}
  .fgrid{grid-template-columns:repeat(3,1fr)}.fbrand{grid-column:1/-1}
  .tuck{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));align-items:stretch}.tstep{min-height:0}
}
@media (max-width:900px){
  .orgrow{grid-template-columns:repeat(2,1fr);padding-top:0}
  .orgrow::before,.orgrow .node::before,.orgrow .node::after{display:none}
  .stem{height:20px}
  .org{border-inline-start:2px solid var(--line);padding-inline-start:.9rem;margin-inline-start:.3rem}
  .orgtop{justify-content:flex-start}.lead-node{width:100%}
  .herz,.vs{grid-template-columns:1fr}.vsb{margin-inline:auto}
  .bones{grid-template-columns:1fr;padding-inline-end:0}
  .bones.top .bone::after,.bones.bot .bone::before{display:none}
  .spine{margin:1rem 0;height:6px}.spine::before{display:none}
  .fprob{position:static;transform:none;width:auto;max-width:none;display:block;margin-bottom:.85rem;text-align:start}
}
@media (max-width:820px){
  :root{--bar:calc(60px + var(--sab))}
  .tabbar{display:grid}
  .lightseg button{width:36px;height:36px}
}
@media (max-width:768px){
  .sec{padding:2rem 0}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .g5{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
  .fgrid{grid-template-columns:repeat(2,1fr);gap:1.3rem}
  .flow{grid-template-columns:1fr;gap:1.45rem}
  .fstep::after{content:"↓"!important;inset-inline-start:50%;top:auto;bottom:-1.25rem;transform:translateX(50%)}
  [dir=ltr] .fstep::after{transform:translateX(-50%)}
  .fstep:last-child::after{display:none}
  .orgrow{grid-template-columns:1fr}
  .ptime{flex-direction:column}
  .pseg{display:flex;align-items:center;gap:.7rem;text-align:start;border-top:0;border-inline-start:5px solid var(--c);padding:.6rem .8rem}
  .pseg small{margin-top:0}
  .net{aspect-ratio:auto;min-height:0;display:flex;flex-direction:column;gap:.6rem}
  .netlinks{display:none}
  .nnode{position:static!important;transform:none!important;width:100%;display:flex;align-items:center;gap:.65rem;text-align:start;border-inline-start:4px solid var(--c)}
  .nnode:hover{transform:none!important}.nnode .ico{margin:0}.nhub{order:-1}
  .mlvl{width:100%!important;clip-path:none!important;border-radius:12px;padding:.8rem .95rem;align-items:flex-start;text-align:start;min-height:0}
  .gantt{min-width:600px}
  .row .btn{flex:1 1 calc(50% - .35rem)}
  .fbot{flex-direction:column;align-items:flex-start}
  .ptools{margin-inline-start:0}
  .btxt small{display:none}
}
@media (max-width:560px){
  .g5{grid-template-columns:repeat(2,1fr)}
  .fgrid{grid-template-columns:1fr}
  .row .btn{flex:1 1 100%}
  .ptools{width:100%}
  .lightseg button:nth-child(3){display:none}
  .setpanel{position:fixed;inset-inline:var(--pad);top:calc(var(--head) + var(--sat) + .5rem);width:auto}
}
@media (max-width:400px){
  .btxt b{font-size:.72rem}
  .iconbtn{width:42px;height:42px}
  .lightseg button{width:34px;height:34px}
  .g5{grid-template-columns:1fr}
  .tabbar a,.tabbar button{font-size:.6rem}
  .mhead{gap:.6rem}
}
@media (max-width:340px){
  .btxt{display:none}
  .lightseg{padding:.15rem}
}
@media (max-height:520px) and (orientation:landscape){
  .hero{padding:1.2rem 0}
  .posterframe{max-width:230px}
  .tabbar{padding-block:.2rem}
  .tabbar a,.tabbar button{min-height:44px;font-size:.58rem}
}
@media (hover:none){.card:hover,.member:hover,.stat:hover,.fstep:hover,.btn:hover{transform:none}}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .rv{opacity:1!important;transform:none!important}
}

/* ═════════ الطباعة ═════════ */
@media print{
  :root{--bg:#fff;--bg2:#fff;--card:#fff;--card2:#fff;--txt:#111827;--txt2:#374151;--line:#c7d2dd;--line2:#dde5ee;--chip:#f3f6f9;--soft:#e6f4f3;--on-c:#fff;--bar:0px}
  @page{margin:14mm}
  body{background:#fff!important;color:#111827!important;font-size:11pt;line-height:1.7}
  body::before,body::after,.orb,.progress,.hdr,.drawer,.scrim,.modal,.lb,.toasts,.filters,.ptools,.totop,.row,.tabbar,.posteract,.uploadrow{display:none!important}
  .wrap{width:100%}.sec{padding:9pt 0}
  .card,.panel,.member,.dg,.stat,.faq details,.node,.fstep,.bone,.tstep,.hcol,.nnode,.pitem,.assetbox{background:#fff!important;border:1px solid #c7d2dd!important;box-shadow:none!important;break-inside:avoid}
  .grad{color:#0f766e!important;-webkit-text-fill-color:#0f766e;background:none!important}
  .rv{opacity:1!important;transform:none!important}
  details>*{display:block!important}summary::after{display:none!important}
  .tw{overflow:visible}table{min-width:0;font-size:9.5pt}
  .gantt{min-width:0}.net{aspect-ratio:auto;display:flex;flex-wrap:wrap;gap:6pt;min-height:0}
  .netlinks{display:none}.nnode{position:static!important;transform:none!important;flex:1 1 30%}
  .gbar,.mlvl,.pseg,.poster{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .posterframe .poster{transform:none!important;animation:none!important;max-width:300px}
  .fgrid{grid-template-columns:1fr 1fr}
  .printinfo{display:block!important;margin-top:8pt;padding:8pt;border:1px solid #c7d2dd;font-size:9.5pt;color:#374151}
}
.printinfo{display:none}
</style>

<body>
<a class="skip" href="#main" id="skip">تجاوز إلى المحتوى الرئيسي</a>
<div class="progress" id="prog" aria-hidden="true"></div>

    <a class="brand" href="#/home" id="brand"><span class="mark" id="brandMark" aria-hidden="true"></span><span class="btxt"><b>IT PROFESSIONALS × OPTITIC</b><small id="brandSub">التقنيات الناشئة والابتكار الرقمي</small></span></a>
    <nav class="nav" id="nav" aria-label="التنقل الرئيسي"></nav>
    <div class="acts">
      <div class="lightseg" id="lightTop" role="group" aria-label="أزرار الإضاءة"></div>

      <div class="setwrap">
        <button class="iconbtn" id="setBtn" type="button" aria-expanded="false" aria-controls="setPanel" aria-label="الإعدادات"><span class="ico i-gear" aria-hidden="true"></span></button>
        <div class="setpanel" id="setPanel" role="dialog" aria-label="الإعدادات"></div>
      </div>

    </div>
  </div>
</header>

<div class="scrim" id="scrim"></div>

  <div class="dhead">

    <button class="iconbtn" id="drawerClose" type="button" aria-label="إغلاق"><span class="ico i-close" aria-hidden="true"></span></button>
  </div>
  <div class="dbody" id="drawerBody"></div>
  <div class="dfoot" id="drawerFoot"></div>
</aside>

    <div class="mtop"><span class="ico i-search" aria-hidden="true" style="color:var(--primary)"></span><input id="searchInput" type="search" autocomplete="off" placeholder="ابحث…"><button class="iconbtn" id="searchClose" type="button" aria-label="إغلاق"><span class="ico i-close" aria-hidden="true"></span></button></div>
    <div class="mres" id="searchRes"></div><div class="mfoot" id="searchFoot"></div>
  </div>
</div>

</div>

<main id="main" tabindex="-1"></main>
<footer class="ftr" id="footer"></footer>
<div class="toasts" id="toasts" aria-live="polite"></div>

  +sec({body:'<div class="grid g2"><article class="panel rv"><div class="cico">'+ico('ai','lg')+'</div><h2>'+t('تعريف الذكاء الاصطناعي','Defining AI')+'</h2><p class="mt-s">'+t('مجال يهدف إلى بناء أنظمة قادرة على أداء مهام إدراكية ترتبط عادةً بالإنسان: فهم اللغة، والتعرّف على الصور، والتنبؤ، والترجمة، والتلخيص، واقتراح الحلول. ويعمل بالاعتماد على بيانات ونماذج رياضية تتعلم العلاقات والأنماط بدلًا من اتباع قواعد ثابتة فقط.','A field building systems able to perform cognitive tasks usually associated with people: language understanding, image recognition, prediction, translation, summarization and suggesting solutions, using data and models that learn patterns rather than only fixed rules.')+'</p><p class="mt-s">'+t('ولا يعني ذلك أن النظام «يفهم» كما يفهم الإنسان؛ بل ينتج مخرجات احتمالية بناءً على ما تدرب عليه، ولهذا تبقى المراجعة البشرية ضرورية.','This does not mean the system “understands” as a person does; it produces probabilistic outputs from its training, which is why human review remains essential.')+'</p></article><article class="panel panel--t rv"><div class="cico">'+ico('gear','lg')+'</div><h2>'+t('آلية العمل بصورة مبسطة','How it works, simply')+'</h2><p class="mt-s">'+t('يستقبل النظام مدخلات (نص، صورة، صوت، بيانات)، ثم يعالجها عبر نموذج مدرَّب لاستخراج الأنماط، ثم ينتج مخرجات مثل إجابة أو تصنيف أو توصية، وتُراجع بشريًا قبل اعتمادها في السياقات المهمة.','The system receives inputs (text, image, audio, data), processes them through a trained model to extract patterns, then produces outputs such as an answer, classification or recommendation, reviewed by people before important use.')+'</p><p class="subh">'+t('مقدمة في تعلم الآلة','Introduction to machine learning')+'</p><p>'+t('بدلًا من كتابة كل قاعدة يدويًا، يُعرض على النظام عدد كبير من الأمثلة، فيستنتج علاقات إحصائية يستخدمها لاحقًا للتعامل مع حالات جديدة. وتتحسن الجودة كلما تحسنت جودة البيانات وتمثيلها للواقع.','Instead of writing every rule by hand, the system is shown many examples and infers statistical relationships it applies to new cases. Quality improves as data better represents reality.')+'</p></article></div>'})
  +sec({alt:true,eyebrow:t('مخطط توضيحي','Diagram'),icon:'flow',title:t('كيف يعمل نظام الذكاء الاصطناعي؟','How an AI system works'),body:dg(t('المدخلات ← المعالجة ← المخرجات ← المراجعة البشرية','Inputs → Processing → Outputs → Human review'),flow([{t:t('المدخلات','Inputs'),d:t('نصوص أو صور أو صوت أو بيانات رقمية.','Text, images, audio or numeric data.'),c:'var(--c2)'},{t:t('معالجة الذكاء الاصطناعي','AI processing'),d:t('نموذج مدرَّب يستخرج الأنماط والعلاقات.','A trained model extracts patterns.'),c:'var(--c1)'},{t:t('المخرجات','Outputs'),d:t('إجابة أو تصنيف أو توصية أو محتوى.','An answer, classification, recommendation or content.'),c:'var(--c3)'},{t:t('المراجعة البشرية','Human review'),d:t('التحقق من الدقة والملاءمة قبل الاعتماد.','Checking accuracy and suitability before reliance.'),c:'var(--c7)'}]),t('الوصف النصي: المخرجات ليست قرارًا نهائيًا؛ تراجع بشريًا وتُعاد صياغتها عند الحاجة، وتبقى المسؤولية للإنسان.','Text description: outputs are not final decisions; human review verifies and rewrites them, and responsibility stays with people.'),'ai')})
  +sec({eyebrow:t('التطبيقات','Applications'),icon:'grid',title:t('أين يظهر الذكاء الاصطناعي؟','Where AI appears'),body:grid(3,[card({icon:'mic',title:t('المساعدات الذكية','Smart assistants'),text:t('أنظمة تفهم الأوامر الصوتية أو النصية وتنفّذ مهامًا مثل التذكير والبحث وضبط الأجهزة.','Systems understanding voice or text commands for reminders, search and device control.')}),card({icon:'spark',title:L('ChatGPT'),c:'var(--c4)',text:t('نموذج محادثة يولّد نصوصًا ويجيب عن الأسئلة ويساعد في الشرح والتلخيص والصياغة.','A conversational model generating text, answering questions and helping with explanation and drafting.')}),card({icon:'search',title:t('التعرف على الصور','Image recognition'),c:'var(--c2)',text:t('تصنيف الصور واكتشاف العناصر، ويستخدم في الفرز والجودة والبحث البصري.','Classifying images and detecting objects for sorting, quality and visual search.')}),card({icon:'gear',title:t('أتمتة الأعمال','Business automation'),c:'var(--c6)',text:t('تنفيذ المهام المتكررة مثل تصنيف الطلبات واستخراج البيانات من المستندات.','Handling repetitive tasks such as triage and document data extraction.')}),card({icon:'doc',title:t('المساعدة في البرمجة','Coding assistance'),c:'var(--c3)',text:t('اقتراح مقاطع برمجية وشرح الأخطاء وتسريع كتابة الاختبارات والتوثيق.','Suggesting code, explaining errors and speeding up tests and documentation.')}),card({icon:'chart',title:t('أدوات الإنتاجية','Productivity tools'),c:'var(--c7)',text:t('تلخيص الاجتماعات وتنظيم المهام وصياغة المراسلات وتحضير مسودات العروض.','Summarizing meetings, organizing tasks, drafting correspondence and deck outlines.')}),card({icon:'book',title:t('التطبيقات التعليمية','Educational uses'),c:'var(--c8)',text:t('شرح المفاهيم بمستويات مختلفة وتوليد تمارين وتقديم تغذية راجعة أولية.','Explaining concepts at different levels, generating exercises and initial feedback.')})])})
  +sec({alt:true,eyebrow:t('التوازن','Balance'),icon:'scale',title:t('الفوائد والتحديات','Benefits and challenges'),body:bvc([t('زيادة الإنتاجية.','Higher productivity.'),t('أتمتة المهام المتكررة.','Automating repetitive tasks.'),t('معالجة المعلومات بسرعة.','Fast information processing.'),t('دعم اتخاذ القرارات.','Decision support.'),t('تخصيص الخدمات.','Personalized services.')],[t('المعلومات غير الدقيقة.','Inaccurate information.'),t('الخصوصية.','Privacy.'),t('التحيز.','Bias.'),t('تكاليف التطبيق.','Implementation costs.'),t('الاعتماد المفرط على التكنولوجيا.','Over-reliance on technology.'),t('التغيرات في الوظائف.','Changes in jobs.')])+exPanel(t('مثال عملي: دعم العملاء','Example: customer support'),t('يتعامل نظام دعم العملاء مع الاستفسارات العامة والمتكررة — مواعيد العمل، حالة الطلب، طريقة الإرجاع — فيقدّم إجابة فورية على مدار الساعة. وعندما يواجه حالة معقدة أو حساسة يحوّلها إلى الموظفين مع ملخص للمحادثة، فيتفرغ الفريق للحالات التي تحتاج حكمًا بشريًا.','An AI support system handles common enquiries — opening hours, order status, returns — giving instant answers around the clock. Complex or sensitive cases are handed to staff with a conversation summary, freeing the team for cases needing human judgment.'))})
  +raiSec('responsible-ai',false)+others('ai');
};
PAGES.vr=function(){
  return phero({c:'var(--c4)',eyebrow:t('التقنية 02','Technology 02'),icon:'vr',parent:[t('التقنيات الناشئة','Emerging Technologies'),'#/technologies'],title:t('الواقع الافتراضي ','Virtual Reality ')+'<span class="grad"><bdi>(VR)</bdi></span>',lead:t('بيئات رقمية غامرة تسمح للمستخدم بالاستكشاف والتفاعل مع عالم افتراضي ثلاثي الأبعاد بدلًا من مشاهدته على شاشة مسطحة.','Immersive digital environments letting users explore and interact with a 3D virtual world instead of watching it on a flat screen.')})
  +sec({body:'<div class="grid g2"><article class="panel rv"><div class="cico">'+ico('vr','lg')+'</div><h2>'+t('تعريف الواقع الافتراضي','Defining VR')+'</h2><p class="mt-s">'+t('تقنية تنشئ بيئة رقمية كاملة تحيط بالمستخدم بصريًا وسمعيًا وتمنحه إحساسًا بالتواجد داخلها. وتختلف عن الواقع المعزز الذي يضيف عناصر رقمية فوق العالم الحقيقي؛ فالواقع الافتراضي يستبدل المشهد المحيط بالكامل.','A technology creating a complete digital environment surrounding the user visually and aurally, giving presence inside it. Unlike augmented reality, which overlays digital elements on the real world, VR replaces the scene entirely.')+'</p><p class="mt-s">'+t('وتكمن قيمته في تحويل المعلومة من وصف نظري إلى تجربة يعيشها المستخدم، وهو ما يفيد في التعليم والتدريب واستكشاف الأماكن.','Its value is turning information from abstract description into lived experience — useful in education, training and exploring places.')+'</p></article><article class="panel panel--t rv"><div class="cico">'+ico('gear','lg')+'</div><h2>'+t('آلية عمل التقنية','How it works')+'</h2><p class="mt-s">'+t('تعرض النظارة صورتين مختلفتين قليلًا — واحدة لكل عين — لتوليد إحساس بالعمق، وتتتبع مستشعرات الحركة اتجاه الرأس فتُحدَّث الصورة فورًا، وتضيف أدوات التحكم إمكانية الإمساك والتأشير والتنقل.','The headset shows two slightly different images — one per eye — for depth; motion sensors track head direction so the image updates instantly; controllers add grabbing, pointing and moving.')+'</p><ul class="ticks mt-s"><li>'+t('عرض مجسّم لكل عين لإنتاج العمق.','A stereoscopic image per eye for depth.')+'</li><li>'+t('تتبع حركة الرأس لتحديث المشهد لحظيًا.','Head tracking updating the scene in real time.')+'</li><li>'+t('معدل تحديث مرتفع لتقليل التأخير وعدم الراحة.','A high refresh rate reducing latency and discomfort.')+'</li><li>'+t('صوت مكاني يعزز الإحساس بالاتجاه والمسافة.','Spatial audio reinforcing direction and distance.')+'</li></ul></article></div>'})
  +sec({alt:true,eyebrow:t('المكوّنات والتطبيقات','Components and uses'),icon:'grid',title:t('الأجهزة ومجالات الاستخدام','Hardware and fields of use'),body:grid(3,[card({icon:'vr',title:t('نظارات الواقع الافتراضي','VR headsets'),text:t('الجهاز الأساسي الذي يعرض البيئة الرقمية ويتتبع حركة الرأس، ومنها أجهزة مستقلة وأخرى تتصل بالحاسوب.','The core device displaying the environment and tracking head movement; standalone or computer-connected.')}),card({icon:'gear',title:t('أدوات التحكم','Controllers'),c:'var(--c2)',text:t('وحدات يدوية تتيح التأشير والإمساك والتنقل والتفاعل مع العناصر.','Handheld units for pointing, grabbing, moving and interacting.')}),card({icon:'slides',title:t('الألعاب','Games'),c:'var(--c3)',text:t('تجارب تفاعلية غامرة تمنح اللاعب حضورًا داخل العالم الرقمي.','Immersive experiences placing the player inside the digital world.')}),card({icon:'book',title:t('التعليم','Education'),c:'var(--c6)',text:t('شرح المفاهيم المجردة عبر نماذج ثلاثية الأبعاد يمكن تفكيكها واستكشافها.','Explaining abstract concepts through 3D models that can be taken apart.')}),card({icon:'shield',title:t('المحاكاة التدريبية','Training simulation'),c:'var(--c7)',text:t('التدرب على إجراءات عملية في بيئة آمنة تسمح بالخطأ والتكرار.','Practising procedures in a safe environment allowing mistakes and repetition.')}),card({icon:'pin',title:t('الجولات الافتراضية','Virtual tours'),c:'var(--c8)',text:t('زيارة المواقع والمعالم والمتاحف عن بعد والتنقل بين نقاطها.','Visiting sites, landmarks and museums remotely and moving between viewpoints.')}),card({icon:'spark',title:t('التجارب الرقمية التفاعلية','Interactive experiences'),c:'var(--c1)',text:t('عروض منتجات ومعارض وتصاميم معمارية يمكن استكشافها قبل تنفيذها.','Product showcases, exhibitions and architectural designs explored before being built.')})])})
  +sec({eyebrow:t('التوازن','Balance'),icon:'scale',title:t('الفوائد والتحديات','Benefits and challenges'),body:bvc([t('تحسين التفاعل مع المحتوى.','Better engagement with content.'),t('توفير بيئات تدريب محاكية.','Simulated training environments.'),t('دعم التعلم.','Supporting learning.'),t('استكشاف الأماكن عن بعد.','Exploring places remotely.'),t('تقديم تجارب تعليمية جديدة.','New kinds of learning experiences.')],[t('تكاليف الأجهزة.','Hardware costs.'),t('متطلبات التشغيل.','Runtime requirements.'),t('إمكانية الوصول.','Accessibility.'),t('الشعور بالدوار أو عدم الراحة لدى بعض المستخدمين.','Motion sickness or discomfort for some users.')])+exPanel(t('مثال عملي','Practical example'),t('يمكن استخدام الواقع الافتراضي في استكشاف مختبر افتراضي أو موقع أثري، حيث يتنقل المستخدم بين عناصر المشهد ويتفاعل معها. كما يمكن إجراء محاكاة تدريبية لإجراء تشغيلي متكرر: يتدرب المستخدم على الخطوات بالترتيب الصحيح ويعيد المحاولة عند الخطأ دون تكلفة أو خطر حتى يتقن الإجراء قبل تطبيقه واقعيًا.','VR can explore a virtual lab or archaeological site, moving between scene elements and interacting. It can also simulate a repeated operating procedure: practising steps in the correct order and retrying after mistakes at no cost or risk before applying it in reality.'))})
  +others('vr');
};
PAGES.iot=function(){
  return phero({c:'var(--c2)',eyebrow:t('التقنية 03','Technology 03'),icon:'iot',parent:[t('التقنيات الناشئة','Emerging Technologies'),'#/technologies'],title:t('إنترنت الأشياء ','Internet of Things ')+'<span class="grad"><bdi>(IoT)</bdi></span>',lead:t('كيف تتصل الأجهزة بالإنترنت وتتبادل البيانات عبر الشبكات، لتتحول الأشياء اليومية إلى أنظمة قابلة للمراقبة والتحكم الآلي.','How devices connect to the internet and exchange data over networks, turning everyday objects into monitorable, controllable systems.')})
  +sec({body:'<div class="grid g2"><article class="panel rv"><div class="cico">'+ico('iot','lg')+'</div><h2>'+t('تعريف إنترنت الأشياء','Defining IoT')+'</h2><p class="mt-s">'+t('شبكة من الأجهزة المادية المزوّدة بمستشعرات وبرمجيات واتصال شبكي، تجمع البيانات من محيطها وتتبادلها مع أنظمة أخرى، مما يتيح المراقبة عن بعد واتخاذ إجراءات آلية أو يدوية.','A network of physical devices with sensors, software and connectivity that collect data from their surroundings and exchange it with other systems, enabling remote monitoring and automatic or manual action.')+'</p><p class="mt-s">'+t('وتكمن قيمته في تحويل الأحداث الفيزيائية — الحرارة، الحركة، الاستهلاك، الرطوبة — إلى بيانات رقمية قابلة للقياس والتحليل.','Its value is turning physical events — temperature, motion, consumption, humidity — into measurable, analysable data.')+'</p></article><article class="panel panel--t rv"><div class="cico">'+ico('gear','lg')+'</div><h2>'+t('المكوّنات الأساسية','Core components')+'</h2><ul class="ticks"><li><strong>'+t('الأجهزة المتصلة:','Connected devices:')+'</strong> '+t('مصابيح، مقابس، كاميرات، أجهزة منزلية وصناعية.','lamps, sockets, cameras, home and industrial appliances.')+'</li><li><strong>'+t('المستشعرات:','Sensors:')+'</strong> '+t('تقيس الحرارة والرطوبة والحركة والإضاءة والاستهلاك.','measuring temperature, humidity, motion, light and consumption.')+'</li><li><strong>'+t('الشبكات:','Networks:')+'</strong> '+t('تنقل البيانات عبر Wi-Fi أو شبكات منخفضة الطاقة أو الخلوية.','carrying data over Wi-Fi, low-power or cellular networks.')+'</li><li><strong>'+t('نظام التحكم:','Control system:')+'</strong> '+t('يحلّل القراءات ويصدر الأوامر وفق قواعد محددة.','analysing readings and issuing commands by defined rules.')+'</li><li><strong>'+t('المراقبة عن بعد:','Remote monitoring:')+'</strong> '+t('واجهات تعرض الحالة وتتيح التحكم من أي مكان.','interfaces showing status and allowing control from anywhere.')+'</li></ul></article></div>'})
  +sec({alt:true,eyebrow:t('مخطط الشبكة','Network diagram'),icon:'flow',title:t('كيف تتدفق البيانات؟','How data flows'),body:dg(t('المستشعرات ← الشبكة ← نظام التحكم ← الأجهزة الذكية','Sensors → Network → Control → Smart devices'),'<div class="net" role="img" aria-label="'+t('مخطط شبكة يربط المستشعرات ونظام التحكم والأجهزة الذكية والمراقبة عن بعد','A network diagram linking sensors, control, smart devices and remote monitoring')+'"><svg class="netlinks" aria-hidden="true"><line class="hot" x1="50%" y1="50%" x2="17%" y2="22%" style="--c:var(--c2)"/><line class="hot" x1="50%" y1="50%" x2="83%" y2="22%" style="--c:var(--c2)"/><line class="hot" x1="50%" y1="50%" x2="17%" y2="80%" style="--c:var(--c2)"/><line x1="50%" y1="50%" x2="83%" y2="80%"/></svg><div class="nnode nhub" style="left:50%;top:50%;--c:var(--c2)">'+ico('iot')+'<b>'+t('الشبكة','Network')+'</b><small>Network</small></div><div class="nnode" style="left:17%;top:22%;--c:var(--c1)">'+ico('chart')+'<b>'+t('المستشعرات','Sensors')+'</b><small>'+t('حرارة · حركة · إضاءة','temp · motion · light')+'</small></div><div class="nnode" style="left:83%;top:22%;--c:var(--c6)">'+ico('gear')+'<b>'+t('نظام التحكم','Control system')+'</b><small>'+t('قواعد وأوامر آلية','rules and commands')+'</small></div><div class="nnode" style="left:17%;top:80%;--c:var(--c3)">'+ico('home')+'<b>'+t('الأجهزة الذكية','Smart devices')+'</b><small>'+t('إضاءة · تكييف · مقابس','lighting · HVAC · sockets')+'</small></div><div class="nnode" style="left:83%;top:80%;--c:var(--c4)">'+ico('search')+'<b>'+t('المراقبة عن بعد','Remote monitoring')+'</b><small>'+t('عرض الحالة والتحكم','status and control')+'</small></div></div>',t('الوصف النصي: ترسل المستشعرات قراءاتها عبر الشبكة إلى نظام التحكم الذي يحلّلها ويصدر أوامر إلى الأجهزة الذكية، بينما تتيح المراقبة عن بعد المتابعة والتدخل اليدوي.','Text description: sensors send readings over the network to the control system, which issues commands to smart devices, while remote monitoring allows checks and manual intervention.'),'iot')})
  +sec({eyebrow:t('التطبيقات','Applications'),icon:'home',title:t('أين يُستخدم إنترنت الأشياء؟','Where IoT is used'),body:grid(4,[card({icon:'home',title:t('المنازل الذكية','Smart homes'),text:t('ربط الإضاءة والتكييف والأجهزة بنظام واحد قابل للتحكم.','Connecting lighting, HVAC and appliances into one controllable system.')}),card({icon:'bulb',title:t('الإضاءة الذكية','Smart lighting'),c:'var(--c6)',text:t('تشغيل وإطفاء تلقائي حسب الحضور والإضاءة الطبيعية.','Automatic switching by occupancy and natural light.')}),card({icon:'chart',title:t('مراقبة درجة الحرارة','Temperature monitoring'),c:'var(--c2)',text:t('قياس مستمر للحرارة والرطوبة مع تنبيهات عند تجاوز الحدود.','Continuous measurement with threshold alerts.')}),card({icon:'grid',title:t('المباني الذكية','Smart buildings'),c:'var(--c3)',text:t('إدارة الطاقة والمصاعد وأنظمة السلامة على مستوى المبنى.','Managing energy, lifts and safety at building scale.')}),card({icon:'gear',title:t('الأتمتة','Automation'),c:'var(--c4)',text:t('تنفيذ إجراءات متكررة تلقائيًا وفق قواعد وشروط محددة.','Running repeated actions automatically by defined rules.')}),card({icon:'search',title:t('المراقبة عن بعد','Remote monitoring'),c:'var(--c7)',text:t('متابعة الحالة من أي مكان عبر واجهة تعرض القراءات والتنبيهات.','Checking status from anywhere with readings and alerts.')})])})

PAGES.robotics=function(){

  +sec({body:'<div class="grid g2"><article class="panel rv"><div class="cico">'+ico('robot','lg')+'</div><h2>'+t('تعريف الروبوتات','Defining robotics')+'</h2><p class="mt-s">'+t('مجال يجمع الهندسة الميكانيكية والإلكترونيات والبرمجة لبناء آلات تستشعر محيطها وتعالج المعلومات وتنفّذ حركة مادية وفق برنامج يحدد خطوات المهمة، وقد تتكيف مع المتغيرات عبر المستشعرات.','A field combining mechanical engineering, electronics and programming to build machines that sense their surroundings, process information and perform motion following a programmed task sequence, adapting through sensors.')+'</p><p class="mt-s">'+t('وتكمن قيمتها في أداء المهام المتكررة بدقة ثابتة لا تتأثر بالتعب، وفي العمل داخل بيئات يصعب على الإنسان العمل فيها بأمان.','Its value is constant precision unaffected by fatigue, and working where people cannot operate safely.')+'</p></article><article class="panel panel--t rv"><div class="cico">'+ico('gear','lg')+'</div><h2>'+t('الآليات المؤتمتة','Automated mechanisms')+'</h2><p class="mt-s">'+t('مستشعرات تجمع المعلومات، ووحدة تحكم تعالجها وتقرر الخطوة التالية، ومشغّلات ميكانيكية تنفّذ الحركة، مع أنظمة سلامة توقف الحركة عند وجود عائق أو خطر.','Sensors gather information, a control unit decides the next step, actuators execute motion, and safety systems stop motion when an obstacle or hazard appears.')+'</p><ul class="ticks mt-s"><li>'+t('استشعار: كاميرات ومستشعرات موضع وقوة.','Sensing: cameras, position and force sensors.')+'</li><li>'+t('معالجة: منطق تحكم يحدد التسلسل والتوقيت.','Processing: control logic for sequence and timing.')+'</li><li>'+t('تنفيذ: أذرع ومحركات وأدوات إمساك.','Actuation: arms, motors and grippers.')+'</li><li>'+t('سلامة: حدود حركة وحساسات توقف طارئ.','Safety: motion limits and emergency stops.')+'</li></ul></article></div>'})
  +sec({alt:true,eyebrow:t('المجالات','Fields'),icon:'grid',title:t('أين تعمل الروبوتات؟','Where robots work'),body:grid(3,[card({icon:'gear',title:t('الروبوتات الصناعية','Industrial robots'),text:t('أذرع مبرمجة تنفّذ اللحام والطلاء والمناولة والتجميع داخل المصانع.','Programmed arms performing welding, painting, handling and assembly.')}),card({icon:'heart',title:t('تطبيقات المستشفيات','Hospital applications'),c:'var(--c8)',text:t('نقل المستلزمات والعيّنات ودعم بعض الإجراءات بدقة عالية تحت إشراف مختصين.','Transporting supplies and samples and supporting procedures under specialist supervision.')}),card({icon:'grid',title:t('التصنيع','Manufacturing'),c:'var(--c3)',text:t('خطوات إنتاجية متسلسلة بمعايير جودة ثابتة على مدار الساعة.','Sequential production steps to constant quality around the clock.')}),card({icon:'flow',title:t('خطوط الإنتاج','Production lines'),c:'var(--c2)',text:t('تكامل الروبوتات مع سيور النقل وأنظمة الفحص لتسريع دورة الإنتاج.','Integrating robots with conveyors and inspection to speed the cycle.')}),card({icon:'clock',title:t('المهام المتكررة','Repetitive tasks'),c:'var(--c4)',text:t('تولّي الأعمال ذات التكرار العالي لتخفيف الحمل عن العاملين.','Taking on highly repetitive work to reduce worker load.')}),card({icon:'users',title:t('التعاون بين الإنسان والروبوت','Human–robot collaboration'),c:'var(--c7)',text:t('روبوتات تعاونية تعمل بجانب الإنسان ضمن مساحة مشتركة مع أنظمة أمان.','Collaborative robots working alongside people with safety systems.')})])})
  +sec({eyebrow:t('التوازن','Balance'),icon:'scale',title:t('الفوائد والتحديات','Benefits and challenges'),body:bvc([t('الدقة.','Precision.'),t('زيادة الإنتاجية.','Higher productivity.'),t('اتساق جودة العمل.','Consistent quality.'),t('تقليل تعرض العاملين لبعض المخاطر المهنية.','Reducing exposure to occupational hazards.'),t('أتمتة المهام المتكررة.','Automating repetitive tasks.')],[t('تكاليف التركيب.','Installation costs.'),t('الصيانة.','Maintenance.'),t('الحاجة إلى خبرات تقنية.','Need for technical expertise.'),t('تغير بعض الوظائف.','Changes in some jobs.'),t('متطلبات السلامة.','Safety requirements.')])+exPanel(t('مثال عملي: التصنيع والتجميع','Example: manufacturing and assembly'),t('تلتقط الأذرع الروبوتية القطع وتضعها في الموضع الصحيح ثم تثبّتها أو تلحمها، بينما تتحقق أنظمة الفحص من الأبعاد والجودة بعد كل خطوة. ولأن الحركة مبرمجة بدقة يتكرر الإجراء بالمواصفات نفسها كل دورة، ويتحول دور العامل إلى مراقبة العملية وضبط الإعدادات ومعالجة الحالات الاستثنائية.','Robotic arms pick parts, place them correctly and fasten or weld them while inspection verifies dimensions and quality after each step. Precisely programmed motion repeats to the same specification every cycle, and the worker\u2019s role shifts to monitoring, adjusting settings and handling exceptions.'))})
  +others('robotics');
};
PAGES.cloud=function(){

function svgSource(kind){

function exportPNG(kind){
  var src=CUSTOM[kind],w=kind==='logo'?1200:1706,h=kind==='logo'?633:2560;
  var img=new Image();
  img.onload=function(){
    try{
      var c=document.createElement('canvas');
      if(src){var r=img.width/img.height;w=kind==='logo'?1200:1706;h=Math.round(w/r);}
      c.width=w;c.height=h;var x=c.getContext('2d');
      if(kind==='logo'&&!src){x.fillStyle='#ffffff';x.fillRect(0,0,w,h);}
      x.drawImage(img,0,0,w,h);
      dl(kind==='logo'?'it-professionals-logo.png':'technology-in-action-brochure.png',c.toDataURL('image/png'));
      toast(t('تم تجهيز الصورة للتحميل.','Image ready for download.'));
    }catch(e){toast(t('تعذّر التصدير في هذا المتصفح؛ جرّب تحميل SVG.','Export failed in this browser; try the SVG download.'));}
  };
  img.onerror=function(){toast(t('تعذّر تجهيز الصورة.','Could not prepare the image.'));};
  if(src){img.src=src;}
  else{img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgSource(kind));}
}
