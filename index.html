function upload(kind,file){
  if(!file||!/^image\//.test(file.type)){toast(t('اختر ملف صورة صالح.','Choose a valid image file.'));return;}
  var fr=new FileReader();
  fr.onload=function(){
    var im=new Image();
    im.onload=function(){
      var max=kind==='logo'?700:1500,r=Math.min(1,max/Math.max(im.width,im.height));
      var c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      var out=c.toDataURL('image/webp',0.92);if(out.indexOf('data:image/webp')!==0)out=c.toDataURL('image/png');
      CUSTOM[kind]=out;try{localStorage.setItem('itp_'+kind,out);}catch(e){}
      render(false);toast(kind==='logo'?t('تم تحديث شعار الفريق في كل الصفحات.','Team logo updated across all pages.'):t('تم تحديث بروشور الدعوة في كل الصفحات.','Invitation brochure updated across all pages.'));
    };

  };

}

}

    else if(a==='copy'){var u=location.href,ok=function(){toast(t('تم نسخ رابط الصفحة.','Page link copied.'));};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(ok,fb);else fb();
      function fb(){var ta=document.createElement('textarea');ta.value=u;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok();}catch(er){toast(t('انسخ الرابط من شريط العنوان.','Copy the link from the address bar.'));}document.body.removeChild(ta);}}
    return;}
  if(e.target.closest('#setBtn')){var op=$('#setPanel').classList.toggle('open');$('#setBtn').classList.toggle('on',op);$('#setBtn').setAttribute('aria-expanded',op?'true':'false');return;}
  if(!e.target.closest('.setwrap'))closeSet();
  if(e.target.closest('#burger')){openDrawer();return;}
  if(e.target.closest('#drawerClose')||e.target.id==='scrim'){closeDrawer();return;}
  if(e.target.closest('#searchBtn')){openSearch();return;}
  if(e.target.closest('#searchClose')||e.target.id==='searchModal'){$('#searchModal').classList.remove('open');return;}
  if(e.target.closest('#lbClose')||e.target.id==='lightbox'){closeLB();return;}
  var link=e.target.closest('a[href^="#/"]');
  if(link){closeDrawer();closeSet();$('#searchModal').classList.remove('open');Array.prototype.forEach.call(document.querySelectorAll('.has'),function(o){o.classList.remove('open');});if(link.getAttribute('href')===location.hash)render();return;}
  if(!e.target.closest('.has'))Array.prototype.forEach.call(document.querySelectorAll('.has'),function(o){o.classList.remove('open');var b=o.querySelector('button');if(b)b.setAttribute('aria-expanded','false');});
});
document.addEventListener('change',function(e){var up=e.target.closest('[data-up]');if(up&&up.files&&up.files[0]){upload(up.getAttribute('data-up'),up.files[0]);up.value='';}});
document.addEventListener('input',function(e){if(e.target.id==='searchInput')renderSearch(e.target.value);});
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();return;}
  if(e.key==='Escape'){closeSet();closeDrawer();closeLB();$('#searchModal').classList.remove('open');Array.prototype.forEach.call(document.querySelectorAll('.has'),function(o){o.classList.remove('open');});return;}
  if($('#searchModal').classList.contains('open')){
    if(e.key==='ArrowDown'){e.preventDefault();moveSel(1);}
    else if(e.key==='ArrowUp'){e.preventDefault();moveSel(-1);}
    else if(e.key==='Enter'){var s=$('#searchRes').querySelector('a.sel');if(s){e.preventDefault();location.hash=s.getAttribute('href');$('#searchModal').classList.remove('open');}}
  }
});
window.addEventListener('hashchange',function(){render();});
window.addEventListener('scroll',function(){var h=document.documentElement.scrollHeight-window.innerHeight;$('#prog').style.transform='scaleX('+(h>0?Math.min(1,window.scrollY/h):0)+')';},{passive:true});
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(window.innerWidth>1180)closeDrawer();var h=document.documentElement.scrollHeight-window.innerHeight;$('#prog').style.transform='scaleX('+(h>0?Math.min(1,window.scrollY/h):0)+')';},150);});
window.addEventListener('orientationchange',function(){setTimeout(function(){closeDrawer();window.scrollTo(0,window.scrollY);},250);});
if(window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: light)');var mh=function(){if(THEME==='auto')setTheme('auto',false);};if(mq.addEventListener)mq.addEventListener('change',mh);else if(mq.addListener)mq.addListener(mh);}

/* ═════════ الإقلاع ═════════ */
if(!location.hash)location.replace('#/home');
setTheme(THEME,false);render();
})();
</script>
</body>
</html>
